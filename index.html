{id:"f21",d:6,q:"An API call returns HTTP 201. What does it mean?",o:["Created","OK with no content","Accepted for later processing","Bad request"],a:[0],e:"200 OK, 201 Created, 202 Accepted (async), 204 No Content, 400 Bad Request, 401 Unauthorized, 403 Forbidden, 404 Not Found, 500 Internal Server Error."},
{id:"f22",d:6,q:"A script gets HTTP 404 from an API. What is the likely problem?",o:["The URL or resource path is wrong","The credentials are wrong","The server crashed","The request was too large"],a:[0],e:"404 means the resource doesn't exist at that URI. Check the path, API version, and IDs."},
{id:"f23",d:6,q:"Which HTTP status code class indicates a server-side error?",o:["5xx","4xx","3xx","2xx"],a:[0],e:"2xx success, 3xx redirection, 4xx client error, 5xx server error."},
{id:"f24",d:6,q:"Many Catalyst Center API calls return HTTP 202 with a task ID. What should the script do next?",o:["Poll the task API with the task ID until it completes, then check the result","Treat the job as done","Resend the request","Log out"],a:[0],e:"202 means accepted for asynchronous processing. GET /dna/intent/api/v1/task/{taskId} shows progress and any error."},
{id:"f25",d:6,q:"Which header carries the Catalyst Center authentication token in API calls?",o:["X-Auth-Token","Authorization: Basic","Cookie: JSESSIONID","Accept"],a:[0],e:"Get the token with POST /dna/system/api/v1/auth/token, then send X-Auth-Token on each request."},
{id:"f26",d:6,q:"Which Catalyst Center API returns the list of managed devices?",o:["GET /dna/intent/api/v1/network-device","POST /dna/system/api/v1/auth/token","GET /restconf/data/interfaces","GET /api/v1/vmanage/devices"],a:[0],e:"The Intent API network-device resource lists devices with hostname, IP, platform, software, and reachability."},
{id:"f27",d:6,q:"How does a script authenticate to the Cisco SD-WAN Manager (vManage) REST API?",o:["POST credentials to /j_security_check to get a session cookie, then get an XSRF token for changes","Use SNMPv3","Use an X-Auth-Token from Catalyst Center","NETCONF hello"],a:[0],e:"vManage uses form login (j_username/j_password) to /j_security_check, returning JSESSIONID. POST/PUT calls also need the token from /dataservice/client/token."},
{id:"f28",d:6,q:"Which base path do most Cisco SD-WAN Manager REST API calls use?",o:["/dataservice/","/dna/intent/api/v1/","/restconf/data/","/api/v0/"],a:[0],e:"For example /dataservice/device lists devices in the overlay."},
{id:"f29",d:6,q:"What is EEM (Embedded Event Manager) used for?",o:["Running actions on a device automatically when a specific event happens, like a syslog message or interface change","Managing wireless clients","Exporting NetFlow","Distributing YANG models"],a:[0],e:"EEM applets watch for events (syslog, SNMP, timers, CLI) and run actions such as CLI commands, emails, or syslog messages."},
{id:"f30",d:6,q:"Look at this EEM applet:\n\nevent manager applet LINK-DOWN\n event syslog pattern \"Interface GigabitEthernet0/1, changed state to down\"\n action 1.0 cli command \"enable\"\n action 2.0 cli command \"show ip route\"\n action 3.0 syslog msg \"Gi0/1 went down\"\n\nWhat triggers it?",o:["A syslog message saying Gi0/1 changed state to down","A timer every minute","An SNMP trap from another device","Manually running the applet"],a:[0],e:"event syslog pattern matches log messages with a regular expression. When matched, the actions run in order of their labels."},
{id:"f31",d:6,q:"In an EEM applet, why is 'action 1.0 cli command \"enable\"' commonly the first action?",o:["Applets start in user EXEC mode, so enable is needed for privileged commands","It enables the applet","It enables logging","It's required syntax with no effect"],a:[0],e:"EEM CLI actions run in a vty-like session starting at user EXEC. enable (and conf t when needed) moves to the right mode."},
{id:"f32",d:6,q:"Which EEM event detector runs an applet on a schedule, like every day at 2 AM?",o:["event timer cron","event syslog","event interface","event none"],a:[0],e:"event timer cron cron-entry \"0 2 * * *\" runs daily at 02:00. event timer watchdog runs every N seconds. event none runs only manually."},
{id:"f33",d:6,q:"How are EEM action labels ordered?",o:["Alphanumerically as strings, so 1.0, 10.0, 2.0 sorts with 10.0 before 2.0","Numerically","In the order typed","Randomly"],a:[0],e:"Labels are sorted as strings. Use consistent formats like 010, 020 or 1.0, 1.1, 1.2 to avoid surprises."},
{id:"f34",d:6,q:"Which configuration management tool is agentless and uses YAML playbooks?",o:["Ansible","Puppet","Chef","SaltStack (with minions)"],a:[0],e:"Ansible connects over SSH, NETCONF, or APIs with nothing installed on the device. Its playbooks are YAML."},
{id:"f35",d:6,q:"Which tool uses manifests written in its own Ruby-based declarative language and typically uses agents that pull config from a master?",o:["Puppet","Ansible","Terraform","Netmiko"],a:[0],e:"Puppet agents pull from the Puppet server (pull model). Manifests describe desired state. Puppet can also run agentless for some network devices via proxies."},
{id:"f36",d:6,q:"Which tool uses 'cookbooks' and 'recipes' written in Ruby?",o:["Chef","Puppet","Ansible","SaltStack"],a:[0],e:"Chef uses a Ruby DSL with recipes grouped into cookbooks, and a client that pulls from the Chef server."},
{id:"f37",d:6,q:"Which tool uses a master and 'minions', a ZeroMQ message bus, and YAML 'state' files?",o:["SaltStack","Chef","Puppet","Ansible"],a:[0],e:"Salt can push or pull, is event-driven, and supports agentless salt-ssh and proxy minions for network devices."},
{id:"f38",d:6,q:"Which pair correctly matches push and pull models?",o:["Ansible push; Puppet and Chef pull","Ansible pull; Puppet push","Chef push; Ansible pull","All are push"],a:[0],e:"Ansible pushes from a control node when you run a playbook. Puppet and Chef agents periodically pull config from a server."},
{id:"f39",d:6,q:"In Ansible, what is the inventory?",o:["The list of managed hosts and groups, with variables","The playbook tasks","The module library","The output log"],a:[0],e:"Inventory (INI or YAML) defines hosts like routers and switches, groups them, and sets connection variables."},
{id:"f40",d:6,q:"Which Ansible component does the actual work on a device, like ios_config or ios_command?",o:["Module","Inventory","Handler","Fact"],a:[0],e:"Tasks call modules. Cisco collections (cisco.ios, cisco.nxos) include modules for config, commands, and resources."},
{id:"f41",d:6,q:"What is the output?\n\nhosts = {\"R1\": \"10.0.0.1\", \"R2\": \"10.0.0.2\"}\nfor name, ip in hosts.items():\n    print(name)",o:["R1 then R2 on separate lines","10.0.0.1 then 10.0.0.2","R1 10.0.0.1","An error"],a:[0],e:".items() yields (key, value) pairs. The loop unpacks them and prints only name."},
{id:"f42",d:6,q:"What is the output?\n\ndef add_vlan(vid, name=\"default\"):\n    return f\"vlan {vid} name {name}\"\n\nprint(add_vlan(10))",o:["vlan 10 name default","vlan 10 name","vlan vid name default","TypeError"],a:[0],e:"name has a default value, so calling with only vid uses 'default'. f-strings insert the variable values."},
{id:"f43",d:6,q:"What is the output?\n\nx = \"GigabitEthernet0/1\"\nprint(x.startswith(\"Gig\"))",o:["True","False","Gig","GigabitEthernet"],a:[0],e:"startswith returns a boolean. Python booleans print as True/False (capitalized)."},
{id:"f44",d:6,q:"What does this code do?\n\nimport requests\nr = requests.get(url, headers=h, verify=False)\nprint(r.status_code)",o:["Sends an HTTP GET without verifying the TLS certificate and prints the status code","Sends a POST and prints the body","Opens an SSH session","Prints the JSON payload"],a:[0],e:"verify=False skips certificate validation, common in labs but unsafe in production. r.json() would parse the body."},
{id:"f45",d:6,q:"Which Python data type is immutable and written with parentheses, like (10, 20)?",o:["Tuple","List","Dictionary","Set"],a:[0],e:"Tuples can't be changed after creation. Lists use [ ] and are mutable. Dicts and sets use { }."},
{id:"f46",d:6,q:"What is the output?\n\nports = [\"Gi1\", \"Gi2\", \"Gi3\", \"Gi4\"]\nprint(ports[1:3])",o:["['Gi2', 'Gi3']","['Gi1', 'Gi2', 'Gi3']","['Gi2', 'Gi3', 'Gi4']","['Gi1', 'Gi2']"],a:[0],e:"Slicing [1:3] takes indexes 1 and 2. The end index isn't included."},
{id:"f47",d:6,q:"What is the output?\n\ncount = 0\nwhile count < 3:\n    count += 1\nprint(count)",o:["3","2","0","4"],a:[0],e:"The loop runs while count is 0, 1, 2, adding 1 each time. When count reaches 3 it stops and prints 3."},
{id:"f48",d:6,q:"What happens if this code runs and the key 'serial' doesn't exist?\n\nprint(device.get(\"serial\", \"unknown\"))",o:["It prints 'unknown'","It raises KeyError","It prints None","It adds 'serial' to the dict"],a:[0],e:"dict.get returns the default instead of raising an error. device['serial'] would raise KeyError."},
{id:"f49",d:6,q:"What is the purpose of try/except in Python?",o:["Handle errors so the script can react instead of crashing","Define a function","Loop over a list","Import a module"],a:[0],e:"For example, catch requests.exceptions.ConnectionError when a device is unreachable and move on to the next one."},
{id:"f50",d:6,q:"Which Python library provides multi-vendor SSH connections that send CLI commands and handle prompts?",o:["Netmiko","requests","json","ncclient"],a:[0],e:"Netmiko builds on Paramiko and handles device-type differences, paging, and prompts for many vendors."},
{id:"f51",d:6,q:"Which statement describes a REST API?",o:["Stateless client-server calls over HTTP using URIs to identify resources","A stateful session over SSH","A binary protocol over UDP","A routing protocol"],a:[0],e:"REST constraints include stateless requests, a uniform interface (HTTP verbs on resource URIs), and cacheable responses."},
{id:"f52",d:6,q:"What does the HTTP 'Content-Type: application/json' header tell the server?",o:["The request body is formatted as JSON","The client wants XML back","The request has no body","The user is authenticated"],a:[0],e:"Content-Type describes what you send. Accept tells the server what format you want back."},
{id:"f53",d:6,q:"Which is a key difference between NETCONF and RESTCONF?",o:["NETCONF uses SSH with XML and supports transactions and candidate datastores; RESTCONF uses HTTPS with XML or JSON","RESTCONF uses SSH","NETCONF uses JSON only","RESTCONF supports locking and commit"],a:[0],e:"NETCONF has richer operations (lock, commit, confirmed-commit, multiple datastores). RESTCONF maps YANG to REST-style HTTP calls."},
{id:"f54",d:6,q:"Given this RESTCONF URI, what is being requested?\n\nGET https://r1/restconf/data/ietf-interfaces:interfaces/interface=GigabitEthernet1",o:["The configuration and state data for interface GigabitEthernet1 from the ietf-interfaces model","All interfaces on the device","The running config in CLI format","Interface counters through SNMP"],a:[0],e:"The path is /restconf/data/<module>:<container>/<list>=<key>. The key value selects one list entry."},
{id:"f55",d:6,q:"What does a Python virtual environment (venv) provide?",o:["An isolated set of packages for a project, separate from the system Python","A virtual machine for running Python","Faster execution","A web-based IDE"],a:[0],e:"python3 -m venv env creates one. Activate it and pip install only that project's dependencies."},
{id:"f56",d:6,q:"Which tool installs Python packages like requests or ncclient?",o:["pip","git","apt only","npm"],a:[0],e:"pip install requests installs from PyPI. requirements.txt lists packages so others can pip install -r it."},
{id:"f57",d:6,q:"Which of these is a Catalyst Center feature that lets you push CLI configuration templates with variables to many devices?",o:["Template Editor (Template Hub)","Assurance","Path Trace","Time travel"],a:[0],e:"Templates use Velocity or Jinja2 variables and can be deployed during provisioning or Day-N."},
{id:"f58",d:6,q:"Which template language is commonly used with Ansible and Python to generate device configs from variables?",o:["Jinja2","Markdown","HTML","SQL"],a:[0],e:"Jinja2 uses {{ variable }} and {% for %} loops to render configuration text from data."},
{id:"f59",d:6,q:"What is YAML commonly used for in network automation?",o:["Human-readable data and configuration files, like Ansible playbooks and inventories","Encrypting data","Packet capture","Binary encoding of telemetry"],a:[0],e:"YAML uses indentation for structure and key: value pairs. It's a superset of JSON."},
{id:"f60",d:6,q:"In YAML, what does a line starting with '- ' represent?",o:["An item in a list","A comment","A key","The end of the file"],a:[0],e:"Dashes mark list items. # starts a comment. key: value is a mapping."},
{id:"f61",d:6,q:"What is idempotency in configuration management?",o:["Running the same task many times leaves the system in the same state without repeated changes","Running tasks in parallel","Rolling back failed changes","Encrypting playbooks"],a:[0],e:"Idempotent modules check current state and only change what differs, so reruns are safe."},
{id:"f62",d:6,q:"What does the Ansible '--check' option do?",o:["Dry run: report what would change without making changes","Checks playbook syntax only","Encrypts variables","Runs only on one host"],a:[0],e:"Check mode predicts changes. --diff shows the differences. --syntax-check validates YAML."},
{id:"f63",d:6,q:"What is the difference between northbound and southbound APIs on a controller like Catalyst Center?",o:["Northbound faces apps and scripts; southbound talks to network devices","Northbound talks to devices; southbound to apps","Both talk to devices","Both talk to apps"],a:[0],e:"Your Python script uses the northbound REST API. The controller uses southbound protocols like NETCONF, SSH, SNMP to configure devices."},
{id:"f64",d:6,q:"Which Catalyst Center API type allows external systems to receive notifications when events happen?",o:["Events and notifications (webhooks)","Southbound SNMP","NETCONF hello","CDP"],a:[0],e:"Catalyst Center can send webhooks, email, or syslog for events like device unreachable to ITSM tools and scripts."},
{id:"f65",d:6,q:"What is the output?\n\nimport json\ndata = '{\"vlans\": [10, 20]}'\nd = json.loads(data)\nprint(type(d[\"vlans\"]))",o:["<class 'list'>","<class 'dict'>","<class 'str'>","<class 'tuple'>"],a:[0],e:"A JSON array becomes a Python list. A JSON object becomes a dict."},
{id:"f66",d:6,q:"In the XML snippet <interface><name>Gi1</name><enabled>true</enabled></interface>, what is 'name'?",o:["A child element of interface","An attribute of interface","The root namespace","A comment"],a:[0],e:"Elements nest inside each other. Attributes look like <interface type=\"ethernet\">."},
{id:"f67",d:6,q:"What does an XML namespace (xmlns) do in NETCONF payloads?",o:["Identifies which YANG model the elements belong to, avoiding name conflicts","Encrypts the XML","Sets the encoding to JSON","Defines the SSH port"],a:[0],e:"For example xmlns=\"urn:ietf:params:xml:ns:yang:ietf-interfaces\" tells the device which model 'interfaces' refers to."},
{id:"f68",d:6,q:"Which NETCONF operation prevents others from changing a datastore while you make changes?",o:["<lock>","<commit>","<discard-changes>","<validate>"],a:[0],e:"<lock> the target, make changes, <commit> (for candidate), then <unlock>."},
{id:"f69",d:6,q:"Which Python code correctly opens a NETCONF session with ncclient?",o:["manager.connect(host=..., port=830, username=..., password=..., hostkey_verify=False)","requests.get('https://host:830')","netmiko.ConnectHandler(device_type='netconf')","json.loads('netconf')"],a:[0],e:"ncclient.manager.connect returns a session; then use m.get_config(source='running') or m.edit_config(target='running', config=xml)."},
{id:"f70",d:6,q:"What does the 'shebang' line #!/usr/bin/env python3 at the top of a script do?",o:["Tells the OS which interpreter to use when running the script directly","Imports Python 3 libraries","Comments out the file","Sets the encoding"],a:[0],e:"With execute permission you can run ./script.py and the OS uses python3 from the PATH."},
{id:"f71",d:6,q:"Which Git command records staged changes in the local repository?",o:["git commit","git push","git clone","git pull"],a:[0],e:"git add stages, git commit saves a snapshot locally, git push sends commits to the remote."},
{id:"f72",d:6,q:"Why use a CI/CD pipeline for network changes?",o:["Automatically test and validate config changes before deploying them consistently","To remove version control","To avoid peer review","To make changes manually faster"],a:[0],e:"Pipelines lint, test in a lab or digital twin, and deploy approved changes, reducing outages from human error."},
{id:"f73",d:6,q:"In an EEM applet, which action sends a message to the log?",o:["action 1.0 syslog msg \"text\"","action 1.0 cli command \"logging\"","action 1.0 log \"text\"","action 1.0 snmp-trap"],a:[0],e:"syslog msg writes a syslog message (with an optional priority). Other actions include mail, snmp-trap, and cli command."},

{id:"f75",d:6,q:"What is the output?\n\nvlans = [10, 20, 30]\nprint(20 in vlans)",o:["True","False","1","20"],a:[0],e:"The in operator checks membership and returns a boolean."},

];

// ---------- storage (fail-safe) ----------
const KEY="encor-practice-v1", SKEY="encor-session-v1";
let mem = {stats:{}, exams:[], size:10, study:false};
function load(){ try{ const r=localStorage.getItem(KEY); if(r){ const p=JSON.parse(r); mem={stats:p.stats||{},exams:p.exams||[],size:p.size||10,study:!!p.study}; } }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(mem)); }catch(e){} }
function saveSession(){ try{ if(S) localStorage.setItem(SKEY, JSON.stringify(S)); else localStorage.removeItem(SKEY);}catch(e){} }
function loadSession(){ try{ const r=localStorage.getItem(SKEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
load();

// ---------- helpers ----------
const $=s=>document.querySelector(s);
const byId=Object.fromEntries(BANK.map(q=>[q.id,q]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L="ABCDEFGH";
const qhtml=s=>{const k=s.indexOf("\n\n"); return k<0?esc(s):esc(s.slice(0,k))+`<pre class="code">${esc(s.slice(k+2))}</pre>`;};
function record(id, ok){ const s=mem.stats[id]||{s:0,c:0,w:false}; s.s++; if(ok)s.c++; s.w=!ok; mem.stats[id]=s; }
function missedIds(){ return BANK.filter(q=>mem.stats[q.id]&&mem.stats[q.id].w).map(q=>q.id); }
function domainStats(d){ let s=0,c=0,seen=0; BANK.filter(q=>q.d==d).forEach(q=>{const t=mem.stats[q.id]; if(t){s+=t.s;c+=t.c;seen++;}}); return {pct:s?Math.round(c/s*100):null,seen,total:BANK.filter(q=>q.d==d).length}; }
function pick(ids){
  const n=mem.size||ids.length;
  const score=id=>{const t=mem.stats[id]; if(!t) return 0; if(t.w) return 1; return 2+t.c/t.s;};
  return shuffle(ids).sort((a,b)=>score(a)-score(b)).slice(0,n);
}
function makeItem(id){ return {id, order:shuffle(byId[id].o.map((_,i)=>i))}; }
function isRight(id, sel){ const a=byId[id].a; return sel && sel.length===a.length && a.every(x=>sel.includes(x)); }

let S=null; // active session
let timerH=null;

// ---------- start modes ----------
function startExam(){
  let ids=[];
  for(const d in DOMAINS){ ids=ids.concat(shuffle(BANK.filter(q=>q.d==d).map(q=>q.id)).slice(0,DOMAINS[d].n)); }
  ids=shuffle(ids);
  S={mode:"exam",study:!!mem.study,items:ids.map(makeItem),i:0,ans:{},flags:{},checked:{},endAt:Date.now()+120*60*1000,title:"Full exam"};
  saveSession(); render();
}
function startMini(){
  const ids=pick5(BANK.map(q=>q.id));
  S={mode:"exam",mini:true,study:!!mem.study,items:ids.map(makeItem),i:0,ans:{},flags:{},checked:{},endAt:Date.now()+6*60*1000,title:"5-question test"};
  saveSession(); render();
}
function pick5(ids){
  const score=id=>{const t=mem.stats[id]; if(!t) return 0; if(t.w) return 1; return 2+t.c/t.s;};
  return shuffle(ids).sort((a,b)=>score(a)-score(b)).slice(0,5);
}
function startPractice(ids,title,kind){
  if(!ids.length){ showModal("Nothing to practice here yet.",[["OK",closeModal]]); return; }
  S={mode:"practice",items:shuffle(ids).map(makeItem),i:0,ans:{},flags:{},checked:{},title,kind:kind||null};
  saveSession(); render();
}
function quick(){ startPractice(pick(BANK.map(q=>q.id)),"Quick practice",{t:"quick"}); }
function drill(d){ startPractice(pick(BANK.filter(q=>q.d==d).map(q=>q.id)),DOMAINS[d].name,{t:"drill",d}); }
function missed(){ startPractice(pick(missedIds()),"Missed questions",{t:"missed"}); }
function nextSet(k){ S=null; if(k.t==="drill") drill(k.d); else if(k.t==="missed") missed(); else quick(); }
const SIZES=[5,10,20,50,0];
const sizeLbl=n=>n?String(n):"All";

// ---------- modal ----------
function showModal(msg,btns){
  $("#modal").innerHTML=`<div class="modal"><div class="card"><p>${msg}</p><div class="row" style="justify-content:flex-end">${btns.map((b,i)=>`<button data-i="${i}" class="${i===btns.length-1?'primary':''}">${b[0]}</button>`).join("")}</div></div></div>`;
  $("#modal").querySelectorAll("button").forEach(b=>b.onclick=()=>btns[+b.dataset.i][1]());
}
function closeModal(){ $("#modal").innerHTML=""; }

// ---------- render ----------
function render(){
  clearInterval(timerH);
  if(!S) return renderHome();
  if(S.done) return renderResults();
  renderQuestion();
}

function renderHome(){
  const m=missedIds().length;
  const last=mem.exams.slice(-5).reverse();
  $("#app").innerHTML=`
  <h1>ENCOR 350-401 Practice</h1>
  <p class="sub">Implementing and Operating Cisco Enterprise Network Core Technologies v1.1 &middot; ${BANK.length} questions &middot; weighted to Cisco's blueprint</p>
  <div class="grid">
    <button class="big primary" id="bExam"><b>Full practice exam</b><span style="color:inherit;opacity:.85">100 questions &middot; ${mem.study?"study mode, no timer, answers as you go":"120 min timer &middot; scored at the end"}</span></button>
    <button class="big" id="bMini"><b>5-question test</b><span>${mem.study?"No timer, answers as you go":"Timed (6 min), scored at the end"}, unseen first</span></button>
    <button class="big" id="bQuick"><b>Quick practice</b><span>${mem.size?mem.size+" questions":"Every question"}, unseen first, answers shown as you go</span></button>
    <button class="big" id="bMiss" ${m?"":"disabled"}><b>Missed questions</b><span>${m} to review${m&&mem.size&&m>mem.size?" &middot; "+mem.size+" at a time":""}</span></button>
  </div>
  <h2>Exam mode</h2>
  <div class="card"><div class="chips" id="rules"><button data-r="0" class="${!mem.study?'on':''}">Exam</button><button data-r="1" class="${mem.study?'on':''}">Study</button></div>
  <p class="note" style="margin-bottom:0">Exam is timed and scored at the end. Study has no timer and shows the answer and explanation after each question. Applies to the full exam and the 5-question test.</p></div>
  <h2>Questions per practice session</h2>
  <div class="card"><div class="chips" id="sizes">${SIZES.map(n=>`<button data-n="${n}" class="${(mem.size||0)===n?'on':''}">${sizeLbl(n)}</button>`).join("")}</div>
  <p class="note" style="margin-bottom:0">Applies to quick practice, domain drills, and missed questions. Questions you haven't seen come first, then ones you missed.</p></div>
  <h2>Drill a domain</h2>
  <div class="card">${Object.entries(DOMAINS).map(([d,x])=>{const st=domainStats(d);return `
    <div class="dom"><div class="lbl"><span><a href="#" data-d="${d}">${d}.0 ${x.name}</a> <span class="tag">${x.w}%</span></span><span class="muted">${st.pct===null?"not started":st.pct+"% &middot; "+st.seen+"/"+st.total+" seen"}</span></div>
    <div class="bar"><i style="width:${st.pct||0}%"></i></div></div>`}).join("")}
    <p class="note">Tap a domain to drill ${mem.size?mem.size+" questions":"every question"} from it.</p>
  </div>
  ${last.length?`<h2>Recent exams</h2><div class="card">${last.map(x=>`<div class="row small"><span>${new Date(x.t).toLocaleDateString()}</span><span class="spacer"></span><b class="${x.p>=80?'pass':'fail'}">${x.p}%</b><span class="muted">${x.c}/${x.n}</span></div>`).join("")}</div>`:""}
  <h2>Your data</h2>
  <div class="card small">
    <p class="muted" style="margin-top:0">Progress saves in this browser only. Copy a backup now and then so you don't lose it.</p>
    <div class="row"><button id="bBackup">Backup / restore</button><button id="bReset">Reset stats</button></div>
  </div>
  <p class="note">Cisco doesn't publish a pass mark. Aim for 80%+ here before booking. Questions are original study material, not exam dumps.</p>`;
  document.querySelectorAll("#sizes [data-n]").forEach(b=>b.onclick=()=>{mem.size=+b.dataset.n;save();render();});
  document.querySelectorAll("#rules [data-r]").forEach(b=>b.onclick=()=>{mem.study=b.dataset.r==="1";save();render();});
  $("#bExam").onclick=startExam; $("#bMini").onclick=startMini; $("#bQuick").onclick=quick; $("#bMiss").onclick=missed;
  document.querySelectorAll("[data-d]").forEach(a=>a.onclick=e=>{e.preventDefault();drill(a.dataset.d);});
  $("#bBackup").onclick=renderBackup;
  $("#bReset").onclick=()=>showModal("Clear all stats and exam history?",[["Cancel",closeModal],["Clear",()=>{mem={stats:{},exams:[],size:mem.size,study:mem.study};save();closeModal();render();}]]);
}

function renderBackup(){
  $("#app").innerHTML=`
  <div class="top"><button id="bBack">&larr; Back</button><b>Backup / restore</b></div>
  <div class="card"><b>Backup</b><p class="small muted">Copy this text and keep it somewhere (notes app, email to yourself).</p>
  <textarea id="out" readonly>${esc(JSON.stringify(mem))}</textarea>
  <div class="row"><button id="bCopy" class="primary">Copy</button><span id="cmsg" class="small muted"></span></div></div>
  <div class="card"><b>Restore</b><p class="small muted">Paste a backup here. This replaces your current stats.</p>
  <textarea id="in" placeholder="Paste backup text"></textarea>
  <div class="row"><button id="bRestore" class="primary">Restore</button><span id="rmsg" class="small"></span></div></div>`;
  $("#bBack").onclick=render;
  $("#bCopy").onclick=async()=>{ const t=$("#out"); try{ await navigator.clipboard.writeText(t.value); $("#cmsg").textContent="Copied."; }catch(e){ t.select(); $("#cmsg").textContent="Selected. Copy it manually."; } };
  $("#bRestore").onclick=()=>{ try{ const p=JSON.parse($("#in").value); if(!p||typeof p.stats!=="object") throw 0; mem={stats:p.stats,exams:p.exams||[],size:p.size||mem.size||10,study:!!p.study}; save(); $("#rmsg").textContent="Restored."; $("#rmsg").className="small pass"; }catch(e){ $("#rmsg").textContent="That doesn't look like a valid backup."; $("#rmsg").className="small fail"; } };
}

function fmt(ms){ ms=Math.max(0,ms); const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000); return m+":"+String(s).padStart(2,"0"); }

function renderQuestion(){
  const it=S.items[S.i], q=byId[it.id], sel=S.ans[S.i]||[], multi=q.a.length>1, checked=S.checked[S.i];
  const exam=S.mode==="exam", study=exam&&S.study;
  const answered=Object.keys(S.ans).filter(k=>S.ans[k]&&S.ans[k].length).length;
  $("#app").innerHTML=`
  <div class="top">
    <button id="bQuit">&times;</button>
    <span class="small"><b>${S.i+1}</b> / ${S.items.length}</span>
    <span class="spacer"></span>
    ${exam&&!study?`<span class="timer" id="tmr"></span>`:`<span class="small muted">${esc(S.title)}</span>`}
  </div>
  <span class="tag">${q.d}.0 ${DOMAINS[q.d].name}</span> ${multi?`<span class="tag">Choose ${q.a.length}</span>`:""}
  <div class="qtext">${qhtml(q.q)}</div>
  <div id="opts">${it.order.map((oi,k)=>{
    let cls="opt";
    if(sel.includes(oi)) cls+=" sel";
    if(checked){ if(q.a.includes(oi)) cls+=" right"; else if(sel.includes(oi)) cls+=" wrong"; }
    return `<button class="${cls}" data-oi="${oi}" ${checked?"disabled":""}><span class="k">${L[k]}</span><span>${esc(q.o[oi])}</span></button>`;}).join("")}</div>
  ${checked?`<div class="explain"><span class="verdict ${isRight(it.id,sel)?'ok':'no'}">${isRight(it.id,sel)?"Correct.":"Not quite."}</span> ${esc(q.e)}</div>`:""}
  <div class="row" style="margin-top:14px">
    ${exam?`<button id="bPrev" ${S.i?"":"disabled"}>Prev</button><button id="bFlag">${S.flags[S.i]?"Unflag":"Flag"}</button><span class="spacer"></span>
      ${study&&!checked?`<button id="bCheck" class="primary" ${sel.length===q.a.length?"":"disabled"}>Check</button>`:""}
      ${S.i<S.items.length-1?`<button id="bNext" class="${study&&!checked?"":"primary"}">Next</button>`:`<button id="bSubmit" class="${study&&!checked?"":"primary"}">Submit exam</button>`}`
    :`${Object.keys(S.checked).length?`<button id="bEnd">End &amp; score</button>`:""}<span class="spacer"></span>${checked?(S.i<S.items.length-1?`<button id="bNext" class="primary">Next</button>`:`<button id="bFinish" class="primary">Finish</button>`):`<button id="bCheck" class="primary" ${sel.length===q.a.length?"":"disabled"}>Check</button>`}`}
  </div>
  ${exam?`<div class="card small"><div class="row"><span class="muted">${answered} answered &middot; ${Object.values(S.flags).filter(Boolean).length} flagged</span><span class="spacer"></span><button id="bSub2">Submit</button></div>
    <div class="nav">${S.items.map((_,k)=>`<button data-j="${k}" class="${(S.ans[k]&&S.ans[k].length)?'ans':''} ${k===S.i?'cur':''} ${S.flags[k]?'fl':''}">${k+1}${S.flags[k]?"*":""}</button>`).join("")}</div></div>`:""}
  `;
  $("#bQuit").onclick=()=>showModal(exam?"Leave this exam? Progress on it will be lost.":"End this practice session?",[["Stay",closeModal],["Leave",()=>{S=null;saveSession();closeModal();render();}]]);
  if(!checked) document.querySelectorAll("#opts .opt").forEach(b=>b.onclick=()=>{
    const oi=+b.dataset.oi; let cur=(S.ans[S.i]||[]).slice();
    if(multi){ cur=cur.includes(oi)?cur.filter(x=>x!==oi):(cur.length<q.a.length?[...cur,oi]:cur); } else cur=[oi];
    S.ans[S.i]=cur; saveSession(); renderQuestion();
  });
  const go=j=>{S.i=j;saveSession();renderQuestion();window.scrollTo(0,0);};
  if($("#bNext")) $("#bNext").onclick=()=>go(S.i+1);
  if($("#bPrev")) $("#bPrev").onclick=()=>go(S.i-1);
  if($("#bFlag")) $("#bFlag").onclick=()=>{S.flags[S.i]=!S.flags[S.i];saveSession();renderQuestion();};
  if($("#bCheck")) $("#bCheck").onclick=()=>{S.checked[S.i]=true; if(!exam){ record(it.id,isRight(it.id,sel)); save(); } saveSession(); renderQuestion();};
  if($("#bFinish")) $("#bFinish").onclick=finish;
  if($("#bEnd")) $("#bEnd").onclick=finish;
  const sub=()=>{ const un=S.items.length-answered; showModal(un?`${un} question${un>1?"s are":" is"} unanswered. Submit anyway?`:"Submit your exam?",[["Keep going",closeModal],["Submit",()=>{closeModal();finish();}]]); };
  if($("#bSubmit")) $("#bSubmit").onclick=sub;
  if($("#bSub2")) $("#bSub2").onclick=sub;
  document.querySelectorAll(".nav [data-j]").forEach(b=>b.onclick=()=>go(+b.dataset.j));
  if(exam&&!study){
    const tick=()=>{ const left=S.endAt-Date.now(); const t=$("#tmr"); if(t){ t.textContent=fmt(left); t.classList.toggle("low",left<5*60000);} if(left<=0){ clearInterval(timerH); finish(); } };
    tick(); timerH=setInterval(tick,1000);
  }
}

function finish(){
  clearInterval(timerH);
  const per={}; let c=0;
  S.items.forEach((it,k)=>{
    const q=byId[it.id], ok=isRight(it.id,S.ans[k]);
    if(S.mode==="exam") record(it.id,ok);
    else if(!S.checked[k]) return;
    per[q.d]=per[q.d]||{c:0,n:0}; per[q.d].n++; if(ok){per[q.d].c++;c++;}
  });
  const n=Object.values(per).reduce((a,b)=>a+b.n,0);
  S.result={c,n,p:n?Math.round(c/n*100):0,per};
  if(S.mode==="exam"&&!S.mini) mem.exams.push({t:Date.now(),c,n,p:S.result.p});
  save(); S.done=true; saveSession(); render(); window.scrollTo(0,0);
}

function renderResults(){
  const r=S.result; let wrongOnly=S.wrongOnly??true;
  const list=S.items.map((it,k)=>({it,k})).filter(({it,k})=>S.mode==="exam"||S.checked[k]).filter(({it,k})=>!wrongOnly||!isRight(it.id,S.ans[k]));
  $("#app").innerHTML=`
  <div class="top"><button id="bHome">&larr; Home</button><b>${esc(S.title)} results</b></div>
  <div class="card"><p class="score ${r.p>=80?'pass':'fail'}">${r.p}%</p><p class="muted" style="margin:0">${r.c} of ${r.n} correct${S.mode==="exam"?" &middot; target 80%+":""}</p></div>
  <div class="card">${Object.entries(r.per).sort().map(([d,x])=>{const p=Math.round(x.c/x.n*100);return `
    <div class="dom"><div class="lbl"><span>${d}.0 ${DOMAINS[d].name}</span><span class="${p>=80?'pass':'fail'}">${x.c}/${x.n} &middot; ${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join("")}</div>
  <div class="row"><h2 style="margin:12px 0">Review</h2><span class="spacer"></span><button id="bToggle">${wrongOnly?"Show all":"Show missed only"}</button></div>
  <div class="card">${list.length?list.map(({it,k})=>{const q=byId[it.id], sel=S.ans[k]||[], ok=isRight(it.id,sel);
    return `<div class="rev"><div class="small muted">Q${k+1} &middot; ${q.d}.0 ${DOMAINS[q.d].name}</div>
    <div style="margin:4px 0 6px;font-weight:700;white-space:pre-wrap">${qhtml(q.q)}</div>
    <div class="small">Your answer: <span class="${ok?'pass':'fail'}">${sel.length?sel.map(i=>esc(q.o[i])).join("; "):"(none)"}</span></div>
    ${ok?"":`<div class="small">Correct: <span class="pass">${q.a.map(i=>esc(q.o[i])).join("; ")}</span></div>`}
    <div class="small muted" style="margin-top:4px">${esc(q.e)}</div></div>`}).join(""):`<p class="muted">Nothing missed. Nice.</p>`}</div>
  <div class="row">${S.kind?`<button id="bNextSet" class="primary">Next ${mem.size||"set"}</button><button id="bAgain">Retry these</button>`:`<button id="bAgain" class="primary">${S.mini?"Another 5":S.mode==="exam"?"New exam":"Practice again"}</button>`}</div>`;
  if($("#bNextSet")) $("#bNextSet").onclick=()=>nextSet(S.kind);
  $("#bHome").onclick=()=>{S=null;saveSession();render();};
  $("#bToggle").onclick=()=>{S.wrongOnly=!wrongOnly;renderResults();};
  $("#bAgain").onclick=()=>{ const m=S.mode, mini=S.mini, ids=S.items.map(i=>i.id), t=S.title, k=S.kind; S=null; if(mini) startMini(); else if(m==="exam") startExam(); else startPractice(ids,t,k); };
}

// resume an in-progress session after refresh
S=loadSession();
if(S && S.mode==="exam" && !S.done && !(S.study||S.strict===false) && Date.now()>S.endAt){ finish(); }
render();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
</body>
</html>
