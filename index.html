<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">

<title>ENCOR 350-401 Practice Exam</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--ink:#16202b;--muted:#5d6b7a;--line:#dde3ea;
  --brand:#0a5cad;--brand-ink:#fff;--ok:#1d7f46;--ok-bg:#e6f4ec;--bad:#b42318;--bad-bg:#fdecea;--flag:#b26a00;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f141a;--card:#18202a;--ink:#e7edf3;--muted:#98a6b5;--line:#2a3542;--brand:#4b9be8;--brand-ink:#0b1117;--ok:#5fd08f;--ok-bg:#16301f;--bad:#ff8a80;--bad-bg:#3a1a18;--flag:#f0b44c;}
}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:760px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
h1{font-size:1.35rem;margin:4px 0 2px}
h2{font-size:1.05rem;margin:22px 0 8px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
button:disabled{opacity:.45;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.big{display:block;width:100%;text-align:left;padding:14px}
.big b{display:block}
.big span{color:var(--muted);font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.dom{margin:8px 0}
.dom .lbl{display:flex;justify-content:space-between;font-size:.88rem}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--brand)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.top{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top);background:var(--bg);padding:8px 0;z-index:2;border-bottom:1px solid var(--line);margin-bottom:12px}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.timer.low{color:var(--bad)}
.tag{display:inline-block;font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:1px 8px}
.qtext{font-size:1.05rem;margin:10px 0 14px;white-space:pre-wrap;overflow-wrap:anywhere}
pre.code{font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0 0;overflow-x:auto;white-space:pre;font-weight:400}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:6px 14px;border-radius:20px}
.chips button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:8px 0;padding:12px}
.opt .k{font-weight:700;min-width:1.2em}
.opt.sel{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.explain{border-left:3px solid var(--brand);padding:8px 12px;margin-top:12px;background:var(--card);border-radius:0 8px 8px 0}
.verdict{font-weight:700}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:10px}
.nav button{padding:6px 0;font-size:.8rem}
.nav .ans{background:var(--line)}
.nav .cur{outline:2px solid var(--brand)}
.nav .fl{color:var(--flag);font-weight:700}
.score{font-size:2.2rem;font-weight:700;margin:0}
.pass{color:var(--ok)}.fail{color:var(--bad)}
textarea{width:100%;min-height:140px;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .card{max-width:420px;width:100%}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev:first-child{border-top:0}
.note{font-size:.8rem;color:var(--muted)}
</style>
</head>

<script>
const DOMAINS = {
  1:{name:"Architecture", w:15, n:15},
  2:{name:"Virtualization", w:10, n:10},
  3:{name:"Infrastructure", w:30, n:30},
  4:{name:"Network Assurance", w:10, n:10},
  5:{name:"Security", w:20, n:20},
  6:{name:"Automation", w:15, n:15}
};

// d=domain, q=question, o=options, a=correct option indexes, e=explanation
const BANK = [
// ---------- Domain 1: Architecture ----------
{id:"a1",d:1,q:"In a three-tier campus design, which layer is the aggregation point for access switches and the usual place for policy, summarization, and the Layer 2/Layer 3 boundary?",o:["Distribution","Access","Core","Edge"],a:[0],e:"Distribution aggregates access blocks, applies policy, summarizes toward the core, and in a traditional design hosts the default gateways (FHRP)."},
{id:"a2",d:1,q:"When does Cisco recommend collapsing the core and distribution layers into a two-tier design?",o:["Small to medium campuses where a separate core adds cost without much benefit","Any campus with more than three buildings","When you need more than 4,094 VLANs","When the access layer runs Layer 3"],a:[0],e:"A collapsed core fits smaller sites. Once you have several distribution blocks, a dedicated core simplifies the full-mesh and scales better."},
{id:"a3",d:1,q:"What is the main job of the campus core layer?",o:["Fast, reliable transport between distribution blocks with minimal policy","Applying user access policy and port security","Providing PoE to endpoints","Running FHRPs for end hosts"],a:[0],e:"The core should be simple, highly available, and fast. Heavy policy and packet manipulation belong at the access and distribution layers."},
{id:"a4",d:1,q:"Which design runs Layer 3 all the way to the access switch, removing STP dependence on uplinks and the need for an FHRP at distribution?",o:["Routed access","Layer 2 looped access","Layer 2 loop-free U topology","Spanning VLANs with MST"],a:[0],e:"In routed access the access switch is the default gateway. Uplinks are routed links using ECMP, which gives fast convergence and no STP blocking on uplinks."},
{id:"a5",d:1,q:"What is the main drawback of a routed access design?",o:["VLANs can't span multiple access switches","STP blocks half the uplinks","Every distribution switch needs HSRP","It can't support ECMP"],a:[0],e:"Because each access switch is its own Layer 3 boundary, a VLAN/subnet is local to that switch. Applications that need Layer 2 adjacency across closets don't fit unless you add an overlay like SD-Access."},
{id:"a6",d:1,q:"Which two stack/redundancy features let a switch keep forwarding during a supervisor failover? (Choose two.)",o:["SSO","NSF","HSRP","UDLD","BFD"],a:[0,1],e:"SSO keeps the standby supervisor synchronized so it takes over immediately. NSF keeps forwarding using the existing FIB while routing protocols re-converge with help from NSF-aware peers."},
{id:"a7",d:1,q:"What does StackWise Virtual provide on a pair of Catalyst 9000 switches?",o:["Two physical switches act as one logical switch, so downstream devices can use multichassis EtherChannel","Two switches share one MAC address table but run separate control planes","Automatic VRRP between the two switches","A dedicated out-of-band management network"],a:[0],e:"StackWise Virtual (like VSS) merges two chassis into one control/management plane. Neighbors bundle links to both with a single MEC, removing STP blocking and the need for FHRP."},
{id:"a8",d:1,q:"Which statement about an on-premises deployment versus a public cloud deployment is correct?",o:["On-premises is CapEx-heavy with full control; cloud shifts cost to OpEx and scales on demand","Cloud always costs less than on-premises","On-premises can't run virtual machines","Cloud gives the customer control of the physical hardware"],a:[0],e:"On-prem means you buy and run the gear (capital expense, full control, slower to scale). Cloud is pay-as-you-go operating expense, elastic, with the provider owning the hardware."},
{id:"a9",d:1,q:"In the cloud service model where the provider manages everything up through the application and you just use it, such as Webex or Microsoft 365, which model applies?",o:["SaaS","PaaS","IaaS","On-premises"],a:[0],e:"SaaS delivers a finished application. PaaS gives you a platform to deploy your own code. IaaS gives you VMs, storage, and networking that you manage from the OS up."},
{id:"a10",d:1,q:"In Cisco SD-WAN, which component authenticates WAN Edge devices and orchestrates the initial connection between them and the controllers, and usually needs a public IP for NAT traversal?",o:["vBond (Validator)","vSmart (Controller)","vManage (Manager)","vEdge"],a:[0],e:"vBond is the orchestrator. It authenticates devices, tells them where the vSmarts and vManage are, and helps with NAT traversal, so it sits on a public address."},
{id:"a11",d:1,q:"Which Cisco SD-WAN component is the control plane that distributes routing and policy using OMP?",o:["vSmart (Controller)","vBond (Validator)","vManage (Manager)","vAnalytics"],a:[0],e:"vSmart controllers run OMP with every WAN Edge, reflecting routes, TLOCs, and policies. They don't forward data traffic."},
{id:"a12",d:1,q:"Which component is the single pane of glass for Cisco SD-WAN configuration, templates, and monitoring?",o:["vManage (Manager)","vSmart (Controller)","vBond (Validator)","WAN Edge"],a:[0],e:"vManage is the management plane: GUI, templates, software upgrades, and REST APIs."},
{id:"a13",d:1,q:"Which protocol runs between Cisco SD-WAN edges and controllers to exchange routes, TLOCs, and policy?",o:["OMP","BGP","OSPF","LISP"],a:[0],e:"Overlay Management Protocol runs inside DTLS/TLS tunnels between WAN Edges and vSmart. Edges can redistribute OMP into BGP or OSPF on the service side."},
{id:"a14",d:1,q:"Which is a benefit of SD-WAN over a traditional router-by-router WAN?",o:["Transport-independent overlay with centralized policy and application-aware path selection","It removes the need for any encryption","It only works over MPLS","It replaces the campus LAN"],a:[0],e:"SD-WAN uses any transport (MPLS, internet, LTE), builds an encrypted overlay, and steers apps by measured loss/latency/jitter from one central policy."},
{id:"a15",d:1,q:"Which is a known limitation or design consideration for Cisco SD-WAN?",o:["Controllers must be reachable for control plane changes, and the overlay adds encapsulation overhead","It can't use internet circuits","It requires all sites to have MPLS","It doesn't support encryption"],a:[0],e:"Edges keep forwarding for a time if controllers are lost (graceful restart), but new policy and route changes need the control plane. IPsec overhead also reduces effective MTU."},
{id:"a16",d:1,q:"In SD-Access, which protocol forms the control plane that maps endpoint identifiers to their location?",o:["LISP","VXLAN","IS-IS","OMP"],a:[0],e:"The control plane node is a LISP map server/resolver. Fabric edges register endpoints and look up where destinations live."},
{id:"a17",d:1,q:"In SD-Access, what is used for the data plane?",o:["VXLAN","LISP data encapsulation","GRE","MPLS"],a:[0],e:"SD-Access uses VXLAN encapsulation (with the Group Policy Option) to carry VN and SGT information across the underlay."},
{id:"a18",d:1,q:"In SD-Access, which technology provides the policy plane?",o:["Cisco TrustSec with SGTs","VRF-Lite only","Port ACLs on every edge","OMP policy"],a:[0],e:"Scalable Group Tags classify users and devices. ISE defines group-based policy, and edge nodes enforce SGACLs."},
{id:"a19",d:1,q:"Which SD-Access node connects the fabric to networks outside it, such as the data center or WAN?",o:["Border node","Edge node","Control plane node","Intermediate node"],a:[0],e:"Border nodes hand off to external networks. Edge nodes connect endpoints. Intermediate nodes are plain underlay routers that just forward IP."},
{id:"a20",d:1,q:"Which routing protocol does Catalyst Center LAN Automation use by default to build the SD-Access underlay?",o:["IS-IS","OSPF","EIGRP","BGP"],a:[0],e:"LAN Automation builds a routed underlay with IS-IS by default. Any IGP works if you build the underlay by hand."},
{id:"a21",d:1,q:"What is the role of Catalyst Center (formerly DNA Center) in SD-Access?",o:["Automation and assurance: it provisions the fabric and monitors it","It forwards VXLAN traffic","It's the LISP map server","It authenticates users with RADIUS"],a:[0],e:"Catalyst Center is the management and orchestration layer. ISE handles identity and policy, and fabric nodes do the forwarding."},
{id:"a22",d:1,q:"Which QoS model reserves resources end-to-end per flow using RSVP?",o:["IntServ","DiffServ","Best effort","MQC"],a:[0],e:"IntServ signals and reserves bandwidth per flow, which doesn't scale well. DiffServ marks packets into classes and handles them per hop."},
{id:"a23",d:1,q:"Which DSCP value is the standard marking for voice bearer traffic?",o:["EF (46)","AF41 (34)","CS3 (24)","AF11 (10)"],a:[0],e:"Expedited Forwarding (46) is for voice media and normally goes into a priority (LLQ) queue. AF41 is typical for interactive video, CS3 for call signaling."},
{id:"a24",d:1,q:"What does the second digit in an AF class like AF31, AF32, AF33 represent?",o:["Drop precedence: higher number is dropped first","Queue priority: higher number is served first","Bandwidth percentage","The CoS value"],a:[0],e:"AFxy: x is the class (queue), y is drop precedence. AF33 is dropped before AF31 during congestion."},
{id:"a25",d:1,q:"What is the difference between policing and shaping?",o:["Policing drops or remarks excess traffic; shaping buffers it and sends it later","Shaping drops excess; policing buffers it","Both buffer excess traffic","Policing only works inbound and shaping only on Layer 2"],a:[0],e:"Policers cap the rate by dropping/remarking (no delay added). Shapers queue excess to smooth to the rate, adding delay but avoiding drops. Shaping is outbound only."},
{id:"a26",d:1,q:"Which queuing mechanism gives voice a strict priority queue while still guaranteeing bandwidth to other classes?",o:["LLQ","FIFO","WRED","Custom queuing"],a:[0],e:"LLQ is CBWFQ plus a strict priority queue. The priority class is implicitly policed so it can't starve the others."},
{id:"a27",d:1,q:"What does WRED do?",o:["Randomly drops lower-priority packets early as a queue fills, to avoid tail drop and TCP global synchronization","Gives voice strict priority","Marks traffic at the trust boundary","Shapes traffic to the CIR"],a:[0],e:"WRED starts dropping packets with higher drop precedence before the queue is full, so TCP flows back off at different times."},
{id:"a28",d:1,q:"Where should traffic classification and marking ideally happen?",o:["As close to the source as possible, at the trust boundary","Only at the WAN edge","Only in the core","At the destination host"],a:[0],e:"Mark at the access edge (or the IP phone) and trust the marking through the network so every hop can act on it consistently."},
{id:"a29",d:1,q:"Which switching method is the slowest on a router because the CPU handles every packet?",o:["Process switching","CEF","Fast switching","Hardware switching in TCAM"],a:[0],e:"Process switching sends each packet to the CPU for a routing table lookup. CEF uses the precomputed FIB and adjacency table instead."},
{id:"a30",d:1,q:"What two tables does CEF build to forward packets? (Choose two.)",o:["FIB","Adjacency table","ARP cache only","Topology table","RIB"],a:[0,1],e:"The FIB is built from the RIB and holds the next-hop for each prefix. The adjacency table holds the prebuilt Layer 2 rewrite for each next hop."},
{id:"a31",d:1,q:"What is the difference between CAM and TCAM on a switch?",o:["CAM matches exact values (MAC table); TCAM also supports 'don't care' bits for prefixes, ACLs, and QoS","CAM is for IPv6 and TCAM for IPv4","TCAM only stores MAC addresses","They are the same thing"],a:[0],e:"CAM does binary exact-match lookups. TCAM uses value, mask, and result, so it can do longest-prefix match and ACL lookups in hardware."},
{id:"a32",d:1,q:"Which wireless deployment tunnels all client traffic from lightweight APs back to a central WLC using CAPWAP?",o:["Centralized (local mode)","FlexConnect with local switching","Autonomous","Mobility Express only"],a:[0],e:"In a centralized design, local mode APs send control and data in CAPWAP to the WLC, which bridges client traffic onto the wired network."},
{id:"a33",d:1,q:"Branch APs need to keep serving clients and switch traffic locally if the WAN link to the central WLC fails. Which AP mode fits?",o:["FlexConnect","Local","Monitor","Sniffer"],a:[0],e:"FlexConnect APs can locally switch data and keep authenticated clients connected in standalone mode while the controller is unreachable."},
{id:"a34",d:1,q:"Which wireless deployment model is managed from a cloud dashboard with no on-premises controller?",o:["Cloud-managed (for example Meraki)","Centralized WLC","Embedded wireless controller on a switch","SD-Access fabric wireless with on-prem WLC"],a:[0],e:"Cloud-managed APs get config and are monitored from a cloud dashboard. Data traffic still goes straight to the local network."},
{id:"a35",d:1,q:"In SD-Access fabric wireless, how is client data traffic handled?",o:["The fabric AP encapsulates it in VXLAN to the fabric edge; the WLC handles only control","It's CAPWAP tunneled to the WLC like local mode","It's bridged untagged at the AP","It's sent to the border node over GRE"],a:[0],e:"Fabric APs keep CAPWAP for control with the WLC but send data in VXLAN to the edge switch, so wireless gets the same distributed forwarding and policy as wired."},
{id:"a36",d:1,q:"What does HSRP, VRRP, or GLBP provide in a campus design?",o:["A redundant default gateway for hosts","Loop prevention at Layer 2","Link aggregation","Faster routing protocol convergence"],a:[0],e:"First hop redundancy protocols share a virtual IP/MAC between routers so hosts keep the same gateway if one router fails."},
{id:"a37",d:1,q:"Which statement best describes a spine-leaf fabric?",o:["Every leaf connects to every spine, giving equal-cost paths and predictable latency","Spines connect to each other in a ring","Leafs connect to each other directly","It relies on STP to block redundant links"],a:[0],e:"In a Clos/spine-leaf design any leaf is two hops from any other leaf through ECMP, and you scale by adding spines or leafs."},
{id:"a38",d:1,q:"Which campus design principle says each layer should have a specific role so the network can grow by adding modules?",o:["Hierarchy and modularity","Flat Layer 2 design","Single point of control","Full mesh at every layer"],a:[0],e:"A hierarchical, modular design (access, distribution, core, plus blocks like WAN, DC, and services) limits failure domains and lets you scale one block at a time."},
{id:"a39",d:1,q:"Which statement about a Layer 2 looped access design (VLANs spanning several access switches) is true?",o:["STP blocks some uplinks and convergence depends on STP","All uplinks forward with ECMP","No FHRP is needed","It removes broadcast domains"],a:[0],e:"When VLANs span switches, loops exist and STP must block links. Convergence and bandwidth use depend on STP, which is why Cisco prefers loop-free designs."},
{id:"a40",d:1,q:"In a traditional Layer 2 access design with HSRP at distribution, what should you align with the HSRP active router?",o:["The STP root bridge for the same VLAN","The VTP server","The DHCP server","The NTP master"],a:[0],e:"Making the HSRP active gateway also the STP root avoids traffic crossing the inter-distribution link before reaching the gateway."},
{id:"a41",d:1,q:"Which tier of a data center network typically hosts the servers and connects to the leaf/access layer?",o:["Leaf (access)","Spine","Core WAN","Internet edge"],a:[0],e:"Servers attach to leaf switches. Spines only interconnect leafs."},
{id:"a42",d:1,q:"A company needs 99.999% uptime for its core. Which design choice helps most?",o:["Redundant devices and links with fast-converging protocols and no single points of failure","A single large chassis with one supervisor","Running STP everywhere with default timers","Using static routes only"],a:[0],e:"High availability comes from redundancy at every layer (devices, supervisors, links, power) plus fast detection like BFD and fast convergence."},
{id:"a43",d:1,q:"What does BFD add to a routing design?",o:["Sub-second detection of forwarding path failures for routing protocols","Encryption of routing updates","Load balancing across unequal paths","Route summarization"],a:[0],e:"BFD sends lightweight hellos (often 50 ms or faster) and tells OSPF, EIGRP, BGP, or HSRP immediately when a neighbor's path fails."},
{id:"a44",d:1,q:"Which statement about a hybrid cloud is correct?",o:["It combines private/on-premises resources with public cloud, connected so workloads can move or interact","It uses two public clouds and no on-prem","It's a cloud used only by one company","It's another name for SaaS"],a:[0],e:"Hybrid joins private and public. Multicloud means more than one public provider. Private cloud is dedicated to one organization."},
{id:"a45",d:1,q:"Which is a typical reason to keep a workload on-premises instead of moving it to public cloud?",o:["Strict data residency or regulatory control requirements","It needs to scale up and down quickly","You want pay-as-you-go pricing","You don't want to manage hardware"],a:[0],e:"Compliance, latency to local systems, and data sovereignty often keep workloads on-prem. Elasticity and OpEx are cloud advantages."},
{id:"a46",d:1,q:"In Cisco SD-WAN, what is a TLOC?",o:["The transport locator: system IP, color, and encapsulation that identifies a WAN edge attachment point","A traffic class for QoS","A type of VPN","The vManage database"],a:[0],e:"A TLOC is the tunnel endpoint on a transport, identified by system IP, color (such as mpls or biz-internet), and encapsulation (IPsec or GRE)."},
{id:"a47",d:1,q:"In Cisco SD-WAN, what does a 'color' identify?",o:["The transport type of a WAN interface, like mpls, biz-internet, or lte","The QoS class of traffic","The VPN number","The device role"],a:[0],e:"Colors label transports and control whether tunnels form (for example private colors use private IPs, public colors use NAT'd public IPs) and are used in policy."},
{id:"a48",d:1,q:"Which Cisco SD-WAN feature monitors loss, latency, and jitter on each tunnel to choose the best path per application?",o:["Application-aware routing using BFD probes","OMP graceful restart","Control policy","Zone-based firewall"],a:[0],e:"BFD runs on every data plane tunnel and measures loss/latency/jitter. App-aware routing policy uses SLA classes to move apps off tunnels that don't meet SLA."},
{id:"a49",d:1,q:"In Cisco SD-WAN, which VPN is reserved for the transport (WAN) side, and which for management?",o:["VPN 0 is transport, VPN 512 is management","VPN 1 is transport, VPN 0 is management","VPN 512 is transport, VPN 0 is management","VPN 10 is transport, VPN 20 is management"],a:[0],e:"VPN 0 holds WAN interfaces and control connections. VPN 512 is out-of-band management. Service VPNs (1 to 511, etc.) carry user traffic."},
{id:"a50",d:1,q:"Which is NOT part of Cisco SD-WAN's controller set?",o:["Map server","vManage","vSmart","vBond"],a:[0],e:"Map server is a LISP/SD-Access role. SD-WAN's controllers are vManage, vSmart, and vBond (Manager, Controller, Validator)."},
{id:"a51",d:1,q:"In SD-Access, what is a virtual network (VN)?",o:["A VRF that provides macro-segmentation inside the fabric","A VLAN on one edge switch","A wireless SSID","An SGT"],a:[0],e:"VNs are VRFs for macro-segmentation. Inside a VN, SGTs provide micro-segmentation between groups."},
{id:"a52",d:1,q:"What is the anycast gateway in SD-Access?",o:["The same gateway IP and MAC for a subnet configured on every fabric edge node","An HSRP group on the border","A default route from the control plane node","A gateway that only exists on the WLC"],a:[0],e:"Every edge hosts the same SVI IP/MAC for a pool, so hosts can roam anywhere in the fabric and keep their gateway with no FHRP."},
{id:"a53",d:1,q:"Which SD-Access component holds the host tracking database (HTDB)?",o:["Control plane node","Border node","Edge node","Extended node"],a:[0],e:"The control plane node is the LISP MS/MR. It keeps the endpoint-to-location database edges register into."},
{id:"a54",d:1,q:"An SD-Access border connects to the internet and unknown destinations. Which border type is it?",o:["External (default) border","Internal border","Anywhere border","Fabric edge"],a:[0],e:"An external border is the gateway of last resort for unknown routes. An internal border connects known networks like a data center. An anywhere border does both."},
{id:"a55",d:1,q:"What is the role of Cisco ISE in SD-Access?",o:["Identity, authentication, and group-based policy (SGTs)","VXLAN forwarding","Underlay routing","Fabric provisioning"],a:[0],e:"ISE authenticates users/devices, assigns SGTs, and stores the policy matrix that Catalyst Center pushes and edges enforce."},
{id:"a56",d:1,q:"Which QoS mechanism happens first as traffic enters the network edge?",o:["Classification and marking","Queuing","Shaping","Congestion avoidance"],a:[0],e:"You classify (identify) and mark traffic at ingress so later hops can apply queuing, policing, and dropping based on that marking."},
{id:"a57",d:1,q:"How many bits make up the DSCP field, and how many bits the older IP Precedence?",o:["DSCP 6 bits, IP Precedence 3 bits","DSCP 3 bits, IP Precedence 6 bits","DSCP 8 bits, IP Precedence 4 bits","Both 6 bits"],a:[0],e:"DSCP uses the top 6 bits of the ToS/Traffic Class byte (64 values). IP Precedence used the top 3 bits. CS values map DSCP back to precedence."},
{id:"a58",d:1,q:"Where is the 802.1p CoS value carried?",o:["In the 3-bit PCP field of the 802.1Q tag","In the IP header","In the TCP header","In the MPLS label stack only"],a:[0],e:"CoS is a Layer 2 marking in the 802.1Q tag, so it only exists on trunks/tagged links. Untagged frames have no CoS."},
{id:"a59",d:1,q:"Which statement about QoS recommendations for voice is correct?",o:["One-way latency under 150 ms, jitter under 30 ms, loss under 1%","Latency under 500 ms is fine","Voice should share a queue with bulk data","Voice should be marked AF11"],a:[0],e:"Classic voice targets are ≤150 ms one-way delay, ≤30 ms jitter, ≤1% loss, which is why voice gets EF and strict priority."},
{id:"a60",d:1,q:"What does the Modular QoS CLI (MQC) use, in order, to apply QoS?",o:["class-map to match, policy-map to act, service-policy to apply","policy-map to match, class-map to act, service-policy to apply","access-list then route-map","service-policy then class-map"],a:[0],e:"Class-maps identify traffic, policy-maps define actions per class, and service-policy attaches the policy to an interface input or output."},
{id:"a61",d:1,q:"What is a trust boundary in QoS?",o:["The point where the network starts trusting the markings it receives","The firewall between inside and outside","The border of an OSPF area","The point where traffic is encrypted"],a:[0],e:"Markings from untrusted endpoints are rewritten. You typically extend trust to an IP phone (conditional trust) but not to a PC behind it."},
{id:"a62",d:1,q:"Which is the most efficient forwarding method on a Cisco router?",o:["CEF","Process switching","Fast switching (route cache)","Netflow switching"],a:[0],e:"CEF precomputes the FIB and adjacencies so every packet, including the first, is switched without CPU route lookups. It's on by default."},
{id:"a63",d:1,q:"Which packets typically get punted to the route processor even with CEF enabled?",o:["Packets destined to the router itself, packets with IP options, or with expired TTL","All TCP packets","All multicast packets","Packets matching the default route"],a:[0],e:"Control/management traffic to the device, TTL-expired packets, and packets needing special handling go to the CPU. That's why CoPP exists."},
{id:"a64",d:1,q:"Which statement about the RIB and FIB is correct?",o:["The RIB is the control plane routing table; the FIB is the data plane copy used to forward","The FIB is built first and the RIB comes from it","They're the same table","The FIB holds only directly connected routes"],a:[0],e:"Routing protocols populate the RIB with the best routes. CEF builds the FIB from it, resolving recursive next hops, for fast forwarding."},
{id:"a65",d:1,q:"Which hardware component lets a Catalyst switch look up ACL entries at line rate?",o:["TCAM","DRAM","NVRAM","Flash"],a:[0],e:"ACLs, QoS policies, and the FIB are programmed into TCAM so the ASIC can match them in one lookup."},
{id:"a66",d:1,q:"Which statement about an Embedded Wireless Controller (EWC) is true?",o:["The WLC runs on a Catalyst 9100 AP or Catalyst 9000 switch, suited to small sites","It requires a dedicated appliance in a data center","It only supports FlexConnect over WAN","It's a cloud-only controller"],a:[0],e:"EWC puts Catalyst 9800 controller software on an AP or switch for small or branch deployments without separate hardware."},
{id:"a67",d:1,q:"Which Catalyst 9800 form factor runs as a virtual machine in a private or public cloud?",o:["Catalyst 9800-CL","Catalyst 9800-80","Catalyst 9800-L","Catalyst 9800 embedded on 9300"],a:[0],e:"9800-CL is the cloud/virtual version for ESXi, KVM, AWS, GCP, or Azure. The 9800-40/80/L are appliances."},
{id:"a68",d:1,q:"In a centralized wireless design, where does the client's IP subnet (VLAN) get bridged to the wired network?",o:["At the WLC","At the AP's switch port","At the core router","At the internet edge"],a:[0],e:"In local mode the WLC terminates the CAPWAP data tunnel and puts client traffic on the WLAN's mapped VLAN on its wired interface."},
{id:"a69",d:1,q:"What does SSO provide on a Catalyst 9800 HA pair?",o:["The standby WLC takes over with AP and client state preserved, so APs don't rejoin","Load sharing of APs between two active controllers","Faster RF roaming","Automatic channel assignment"],a:[0],e:"With SSO, AP CAPWAP sessions and client sessions are synced, so a controller failure doesn't force APs and clients to reconnect."},
{id:"a70",d:1,q:"What does N+1 WLC redundancy mean?",o:["One backup controller serves APs from several primary controllers if one fails","Two active controllers share each AP","Every AP has its own controller","Each controller has N+1 power supplies"],a:[0],e:"In N+1, APs are configured with primary/secondary/tertiary controllers. On failure they rejoin the backup, which causes a brief outage, unlike SSO."},
{id:"a71",d:1,q:"Which statement compares a fabric (SD-Access) campus to a traditional campus correctly?",o:["Fabric uses an overlay so subnets can exist anywhere, with policy tied to identity instead of IP/VLAN","Fabric requires spanning tree on all uplinks","Traditional campus uses SGTs by default","Fabric can't use wireless"],a:[0],e:"The overlay decouples location from addressing, and SGT policy follows the user, so you don't need per-VLAN ACLs everywhere."},
{id:"a72",d:1,q:"Which Cisco SD-WAN plane uses DTLS or TLS tunnels between edges and controllers?",o:["Control plane","Data plane","Service plane","Policy plane"],a:[0],e:"Control connections (to vSmart, vManage, vBond) are DTLS by default or TLS. Data plane tunnels between edges use IPsec."},
{id:"a73",d:1,q:"What is the purpose of a QoS policer with 'conform-action transmit exceed-action set-dscp-transmit af13'?",o:["Traffic over the rate is remarked to a higher drop precedence instead of dropped","All traffic is dropped above the rate","Traffic is buffered when over the rate","Traffic is prioritized when over the rate"],a:[0],e:"Remarking excess traffic to AF13 lets it pass now but makes it first to drop (via WRED) if congestion happens later."},
{id:"a74",d:1,q:"Which two items are fundamental parts of a high availability campus design? (Choose two.)",o:["Redundant uplinks to separate distribution switches","Redundant supervisors or stacking with SSO","A single default gateway with no FHRP","Disabling all routing protocols","Long STP timers"],a:[0,1],e:"Dual-homed uplinks and device-level redundancy (supervisors, stacks, SSO/NSF) remove single points of failure."},
{id:"a75",d:1,q:"Which describes Cisco's 'Layer 2 loop-free U' topology?",o:["VLANs span only the access switches and the distribution link between them, with no loop to block","Every VLAN spans the whole campus","Access switches have no uplinks","Routing runs to the access layer"],a:[0],e:"In a U design the Layer 2 domain forms a U shape through the distribution pair without loops, so STP doesn't block uplinks, but VLANs still can't extend widely."},
// ---------- Domain 2: Virtualization ----------
{id:"b1",d:2,q:"Which hypervisor type runs directly on the server hardware, like VMware ESXi or KVM?",o:["Type 1 (bare metal)","Type 2 (hosted)","Container runtime","Emulator"],a:[0],e:"Type 1 hypervisors sit on the hardware. Type 2 hypervisors (VirtualBox, VMware Workstation) run as an application on top of a host OS."},
{id:"b2",d:2,q:"Which is a Type 2 hypervisor?",o:["Oracle VirtualBox","VMware ESXi","Microsoft Hyper-V Server","Citrix XenServer"],a:[0],e:"VirtualBox runs inside a desktop OS. ESXi, Hyper-V Server, and Xen are bare-metal Type 1 hypervisors."},
{id:"b3",d:2,q:"What is the main difference between a virtual machine and a container?",o:["A VM includes its own guest OS; containers share the host OS kernel","Containers include a full guest OS; VMs share the kernel","Containers need a Type 1 hypervisor","VMs can't run on x86 hardware"],a:[0],e:"Containers are lighter because they package only the app and its libraries and share the host kernel. VMs virtualize hardware and run a full OS."},
{id:"b4",d:2,q:"What does a virtual switch (vSwitch) do on a hypervisor host?",o:["Connects VM virtual NICs to each other and to the host's physical NICs","Encrypts traffic between VMs","Assigns IP addresses to VMs","Runs the guest OS"],a:[0],e:"The vSwitch forwards frames between VMs on the same host and uplinks them to the physical network, often with VLAN tagging."},
{id:"b5",d:2,q:"What is Network Functions Virtualization (NFV)?",o:["Running network functions like routers, firewalls, and WLCs as software on standard servers","Splitting the control plane from hardware using OpenFlow","Running VLANs on every switch","Virtualizing the RF spectrum"],a:[0],e:"NFV replaces dedicated appliances with VNFs (for example Catalyst 8000V, ASAv, Catalyst 9800-CL) on commodity x86 hardware."},
{id:"b6",d:2,q:"Which Cisco platform runs Enterprise NFV (NFVIS) to host VNFs at a branch?",o:["Cisco ENCS / Catalyst 8200 uCPE","Catalyst 2960","Nexus 2000 FEX","Aironet 1800"],a:[0],e:"NFVIS on ENCS or uCPE hardware hosts virtual routers, firewalls, and WAN optimization on one branch box."},
{id:"b7",d:2,q:"Which technology creates multiple routing tables on one router so overlapping IP ranges can coexist?",o:["VRF","VLAN","HSRP","PBR"],a:[0],e:"A VRF is a separate routing and forwarding instance. Interfaces belong to one VRF, and routes in one VRF don't mix with others unless you leak them."},
{id:"b8",d:2,q:"R1 has interface Gi0/1 in VRF CUST-A. Which command shows the routes for that VRF?",o:["show ip route vrf CUST-A","show ip route","show vrf routes CUST-A","show ip route CUST-A"],a:[0],e:"The global table doesn't show VRF routes. Use show ip route vrf NAME, and ping vrf NAME to test from within it."},
{id:"b9",d:2,q:"What happens to an interface's existing IP address when you apply 'vrf forwarding RED' to it?",o:["The IP address is removed and must be configured again","Nothing; the IP stays","The IP moves to a loopback","The interface shuts down permanently"],a:[0],e:"IOS removes the IP when you change an interface's VRF membership. You need to re-enter ip address afterward."},
{id:"b10",d:2,q:"What is VRF-Lite?",o:["VRFs used without MPLS, with a separate interface or subinterface per VRF between devices","VRFs that only support IPv6","A VRF with a single route","MPLS L3VPN between providers"],a:[0],e:"VRF-Lite gives path isolation hop by hop, usually with 802.1Q subinterfaces per VRF. It doesn't need MPLS labels or MP-BGP."},
{id:"b11",d:2,q:"What is the default protocol number and overhead for a basic GRE tunnel over IPv4?",o:["IP protocol 47, 24 bytes (20 IP + 4 GRE)","IP protocol 50, 8 bytes","UDP 4789, 50 bytes","TCP 1723, 20 bytes"],a:[0],e:"GRE is IP protocol 47. A new 20-byte IP header plus a 4-byte GRE header is why tunnel MTU is often set to 1476 (or lower with IPsec)."},
{id:"b12",d:2,q:"Which statement about GRE is true?",o:["It can carry multicast and routing protocols but doesn't encrypt","It encrypts traffic by default","It can't carry IPv6","It only works over Layer 2 links"],a:[0],e:"GRE is a simple, flexible encapsulation that supports multicast (so OSPF/EIGRP work across it) but provides no confidentiality. Pair it with IPsec for encryption."},
{id:"b13",d:2,q:"A GRE tunnel keeps flapping with the message 'recursive routing'. What is the cause?",o:["The router learns the route to the tunnel destination through the tunnel itself","The tunnel source is a loopback","Keepalives are disabled","The tunnel MTU is 1476"],a:[0],e:"If the tunnel's destination is reachable via the tunnel, the router can't build it. Fix it by not advertising the transport addresses into the tunnel's routing process, or with a static route via the physical path."},
{id:"b14",d:2,q:"Which IPsec protocol provides encryption, integrity, and authentication?",o:["ESP","AH","IKE","GRE"],a:[0],e:"ESP (IP protocol 50) encrypts and authenticates. AH (protocol 51) authenticates and checks integrity but doesn't encrypt, and it breaks through NAT."},
{id:"b15",d:2,q:"Which IPsec mode encrypts the entire original IP packet and adds a new IP header?",o:["Tunnel mode","Transport mode","Aggressive mode","Main mode"],a:[0],e:"Tunnel mode protects the whole original packet (used site-to-site). Transport mode protects only the payload and keeps the original header (used for host-to-host or GRE over IPsec)."},
{id:"b16",d:2,q:"What is the purpose of IKE Phase 1?",o:["Establish a secure, authenticated channel between peers to negotiate IPsec SAs","Encrypt user data","Assign IP addresses to remote clients","Build the GRE tunnel"],a:[0],e:"Phase 1 (IKE SA / ISAKMP SA) authenticates peers and sets up a protected channel. Phase 2 (Quick Mode in IKEv1) negotiates the IPsec SAs that protect data."},
{id:"b17",d:2,q:"Which IKE version uses fewer messages, has built-in NAT traversal and dead peer detection, and is the current standard?",o:["IKEv2","IKEv1 main mode","IKEv1 aggressive mode","ISAKMP v0"],a:[0],e:"IKEv2 sets up the first child SA in 4 messages, includes NAT-T and DPD natively, and supports EAP. IKEv1 main mode needs 6 messages plus Quick Mode."},
{id:"b18",d:2,q:"Which UDP port does IPsec NAT traversal use?",o:["4500","500","4789","1701"],a:[0],e:"IKE starts on UDP 500. When NAT is detected, IKE and ESP move to UDP 4500 so the NAT device can track the flow."},
{id:"b19",d:2,q:"What is an advantage of a virtual tunnel interface (VTI) over a crypto map for IPsec?",o:["It's a routable interface, so dynamic routing and per-tunnel features work without crypto ACLs","It doesn't need IKE","It doesn't encrypt traffic","It only works with IKEv1"],a:[0],e:"With a VTI, anything routed into the tunnel interface is encrypted. You can run OSPF/EIGRP over it and apply QoS or ACLs per tunnel."},
{id:"b20",d:2,q:"In LISP, what is an EID?",o:["The endpoint identifier: the address of the host","The routable address of the edge router","The map server address","A VXLAN segment ID"],a:[0],e:"LISP separates identity (EID) from location (RLOC). Hosts keep their EIDs while the RLOC tells the network where they are attached."},
{id:"b21",d:2,q:"Which LISP device registers EID-to-RLOC mappings with the map server?",o:["ETR","ITR","PITR","Map resolver"],a:[0],e:"The Egress Tunnel Router registers the EID prefixes behind it. The Ingress Tunnel Router queries the map resolver and encapsulates traffic to the right RLOC."},
{id:"b22",d:2,q:"What does a LISP ITR do when it receives traffic for an EID it has no mapping for?",o:["Sends a Map-Request to the map resolver","Floods the packet out all interfaces","Drops it permanently","Sends a Map-Register"],a:[0],e:"The ITR sends a Map-Request, caches the reply in its map cache, and then encapsulates packets to the destination RLOC."},
{id:"b23",d:2,q:"Which LISP device lets non-LISP sites reach LISP EIDs and vice versa?",o:["Proxy ITR / Proxy ETR","Map server","Map resolver","xTR only"],a:[0],e:"PITRs attract traffic from non-LISP networks to EID space. PETRs let LISP sites send to non-LISP destinations."},
{id:"b24",d:2,q:"What is the size of the VXLAN Network Identifier (VNI) and how many segments does it allow?",o:["24 bits, about 16 million","12 bits, 4,094","16 bits, 65,535","32 bits, about 4 billion"],a:[0],e:"The 24-bit VNI gives roughly 16 million segments, much more than the 12-bit VLAN ID's 4,094."},
{id:"b25",d:2,q:"Which UDP destination port does standard VXLAN use?",o:["4789","4500","8472 only","500"],a:[0],e:"IANA assigned UDP 4789. VXLAN adds about 50 bytes of overhead (outer Ethernet, IP, UDP, and an 8-byte VXLAN header), so the underlay MTU should be raised."},
{id:"b26",d:2,q:"What is a VTEP?",o:["The device that encapsulates and decapsulates VXLAN traffic","The VXLAN control plane database","A type of virtual machine","A spanning tree port state"],a:[0],e:"VXLAN Tunnel Endpoints map local VLANs/hosts to VNIs and tunnel frames across the IP underlay to other VTEPs."},
{id:"b27",d:2,q:"Which control plane is commonly used with VXLAN in data center fabrics to distribute MAC and IP reachability instead of flood-and-learn?",o:["MP-BGP EVPN","OSPF","STP","LACP"],a:[0],e:"BGP EVPN advertises host MAC/IP routes, so VTEPs learn remote endpoints through the control plane rather than flooding."},
{id:"b28",d:2,q:"Why does VXLAN suit multi-tenant networks better than plain VLANs?",o:["It stretches Layer 2 over a routed Layer 3 underlay and supports millions of segments","It removes the need for IP routing","It encrypts all traffic by default","It only works on a single switch"],a:[0],e:"VXLAN overlays Layer 2 segments on an ECMP-friendly IP underlay with no STP, and the 24-bit VNI scales far past 4,094 VLANs."},
{id:"b29",d:2,q:"Which command places an interface into VRF BLUE on IOS XE?",o:["vrf forwarding BLUE","ip vrf BLUE","vrf definition BLUE","ip route vrf BLUE"],a:[0],e:"vrf definition BLUE creates the VRF (with address-family ipv4). Under the interface, vrf forwarding BLUE assigns it. Older IOS used ip vrf / ip vrf forwarding."},
{id:"b30",d:2,q:"What must you configure under 'vrf definition RED' before IPv4 can be used in it?",o:["address-family ipv4","rd 100:1 only","route-target both","ip routing"],a:[0],e:"The multiprotocol VRF syntax needs each address family enabled. An RD is only required when you use MP-BGP."},
{id:"b31",d:2,q:"Two customers both use 10.1.1.0/24 on the same PE router. What keeps the routes separate?",o:["Each customer's interfaces are in different VRFs","Different OSPF process IDs only","Using secondary IP addresses","Different VLAN IDs only"],a:[0],e:"Separate VRFs give each customer an independent routing table, so the same prefix can exist in both."},
{id:"b32",d:2,q:"What is the purpose of a route distinguisher (RD) in MPLS L3VPN?",o:["To make overlapping customer prefixes unique in MP-BGP (VPNv4)","To control which VRFs import a route","To encrypt VPN traffic","To identify the VLAN"],a:[0],e:"The RD is prepended to the IPv4 prefix to form a unique VPNv4 route. Route targets control import and export between VRFs."},
{id:"b33",d:2,q:"What do route targets control?",o:["Which VRFs export and import routes","How a prefix is made unique","The MPLS label value","The tunnel source"],a:[0],e:"Export RTs are attached to routes as extended communities. A VRF imports any route carrying an RT that matches its import list, which also enables route leaking."},
{id:"b34",d:2,q:"Which command configures a GRE tunnel's source and destination?",o:["tunnel source and tunnel destination under interface Tunnel","ip tunnel source/destination in global config","crypto map peer","ip route tunnel"],a:[0],e:"interface Tunnel0, ip address, tunnel source (interface or IP), tunnel destination (remote IP). tunnel mode gre ip is the default."},
{id:"b35",d:2,q:"A GRE tunnel shows 'Tunnel0 is up, line protocol is up' even though the far end is down. Which feature fixes this?",o:["GRE keepalives","Tunnel key","IP MTU 1400","NHRP"],a:[0],e:"Without keepalives, a GRE tunnel is up as long as the source is up and a route to the destination exists. Keepalives bring the line protocol down when the far end stops answering."},
{id:"b36",d:2,q:"Why would you set 'ip tcp adjust-mss 1360' on a GRE over IPsec tunnel?",o:["To keep TCP segments small enough to avoid fragmentation after encapsulation overhead","To increase throughput by sending jumbo frames","To enable compression","To set the tunnel keepalive timer"],a:[0],e:"Encapsulation adds headers. Lowering MSS in the TCP handshake keeps packets under the tunnel MTU so they aren't fragmented or dropped."},
{id:"b37",d:2,q:"Which technology builds on-demand spoke-to-spoke tunnels in a hub-and-spoke design using mGRE and NHRP?",o:["DMVPN","GETVPN","FlexVPN site-to-site with static tunnels","L2TPv3"],a:[0],e:"DMVPN uses multipoint GRE and NHRP so spokes learn each other's public addresses from the hub and build direct tunnels as needed (Phase 2/3)."},
{id:"b38",d:2,q:"Which encryption algorithm is the strong, recommended choice for IPsec today?",o:["AES-GCM 256","DES","3DES","MD5"],a:[0],e:"AES (especially GCM, which also provides integrity) is recommended. DES and 3DES are obsolete. MD5 is a hash, not encryption, and is also weak."},
{id:"b39",d:2,q:"What does Diffie-Hellman do in IKE?",o:["Lets two peers derive a shared secret key over an untrusted network","Authenticates peers with certificates","Hashes the data","Compresses the payload"],a:[0],e:"DH exchanges public values to compute the same secret on both sides. Higher groups (14, 19, 20, 21) are stronger. PFS runs a new DH exchange for each Phase 2 SA."},
{id:"b40",d:2,q:"Which two methods can authenticate IKE peers? (Choose two.)",o:["Pre-shared keys","RSA signatures (certificates)","Diffie-Hellman group 2","ESP","AH"],a:[0,1],e:"Peers authenticate with PSKs or digital certificates (and IKEv2 also supports EAP). DH is key exchange; ESP and AH protect data."},
{id:"b41",d:2,q:"In LISP, what is an RLOC?",o:["The routing locator: the IP address of the xTR in the underlay","The host's own IP","A VXLAN ID","A map server name"],a:[0],e:"RLOCs are routable underlay addresses of LISP routers. EIDs are mapped to RLOCs so the core only needs to route RLOCs."},
{id:"b42",d:2,q:"Which LISP message does an ETR send to the map server to announce its EID prefixes?",o:["Map-Register","Map-Request","Map-Reply","Map-Notify"],a:[0],e:"ETRs send Map-Register. The MS may confirm with Map-Notify. ITRs send Map-Request, and the ETR (or MS in proxy mode) sends Map-Reply."},
{id:"b43",d:2,q:"What is one key benefit of LISP for host mobility?",o:["A host keeps its IP address when it moves; only its RLOC mapping changes","Hosts get a new IP every time they move","It eliminates the need for routing","It requires stretching VLANs everywhere"],a:[0],e:"Because identity (EID) is separate from location, the mapping system just updates the RLOC when a host moves."},
{id:"b44",d:2,q:"In flood-and-learn VXLAN, how is BUM traffic usually delivered?",o:["Using underlay multicast groups or head-end (ingress) replication","Using STP","Using LISP Map-Requests","It's always dropped"],a:[0],e:"Broadcast, unknown unicast, and multicast are sent to an underlay multicast group mapped to the VNI, or replicated as unicast to each remote VTEP."},
{id:"b45",d:2,q:"What does VXLAN-GPO (Group Policy Option) add, as used in SD-Access?",o:["A field carrying the source SGT in the VXLAN header","A second VNI","Encryption keys","A LISP EID"],a:[0],e:"The GPO extension carries the 16-bit group tag so the destination edge can enforce SGACL policy."},
{id:"b46",d:2,q:"What does a hypervisor do?",o:["Shares physical CPU, memory, storage, and NICs among multiple isolated virtual machines","Replaces the need for an operating system in VMs","Routes traffic between VLANs","Only runs containers"],a:[0],e:"The hypervisor abstracts hardware and schedules resources so many VMs, each with its own OS, run on one host."},
{id:"b47",d:2,q:"Which technology lets a VM bypass the vSwitch and access a physical NIC's virtual function directly for near line-rate performance?",o:["SR-IOV","vMotion","OVS","VXLAN"],a:[0],e:"SR-IOV exposes virtual functions of a NIC to VMs, cutting hypervisor overhead. It's common for high-throughput VNFs."},
{id:"b48",d:2,q:"Which is an example of a virtual switch used in KVM/Linux environments?",o:["Open vSwitch (OVS)","Catalyst 9300","Nexus 9000","Meraki MS"],a:[0],e:"OVS is an open source multilayer virtual switch. VMware uses vSS/vDS. Catalyst and Nexus are physical."},
{id:"b49",d:2,q:"What does VMware vMotion do?",o:["Moves a running VM to another host with no downtime","Backs up VMs to tape","Encrypts VM traffic","Creates VLANs on the host"],a:[0],e:"vMotion live-migrates VMs between hosts, which needs shared storage access and Layer 2 reachability for the VM network, or an overlay."},
{id:"b50",d:2,q:"Which VRF feature lets a route from one VRF be used in another?",o:["Route leaking (route-target import/export or static routes across VRFs)","VRF deletion","Policy-based routing only","VTP pruning"],a:[0],e:"Route leaking shares selected routes between VRFs, for example to give several VRFs access to shared services."},
// ---------- Domain 3: Infrastructure ----------
{id:"c1",d:3,q:"Two switches are connected. Both ports are set to 'switchport mode dynamic auto'. What happens?",o:["The link stays an access port","The link becomes a trunk","The link goes err-disabled","The link negotiates ISL"],a:[0],e:"Dynamic auto only responds to DTP; it doesn't initiate. With auto on both sides nobody asks, so the link stays access. Desirable on at least one side forms a trunk."},
{id:"c2",d:3,q:"Which DTP combination forms a trunk?",o:["dynamic desirable and dynamic auto","dynamic auto and dynamic auto","access and dynamic desirable","trunk with nonegotiate and dynamic auto"],a:[0],e:"Desirable actively asks. Auto agrees. Nonegotiate stops DTP frames, so a dynamic auto neighbor never hears a request and stays access."},
{id:"c3",d:3,q:"Which command disables DTP on a port that is statically set to trunk?",o:["switchport nonegotiate","no switchport","switchport mode access","spanning-tree portfast"],a:[0],e:"switchport nonegotiate stops DTP frames. Best practice is static trunk plus nonegotiate, and access ports set to access, to prevent switch spoofing."},
{id:"c4",d:3,q:"What is the default native VLAN on an 802.1Q trunk, and how is its traffic sent?",o:["VLAN 1, sent untagged","VLAN 1, sent tagged","VLAN 1002, untagged","No native VLAN by default"],a:[0],e:"Native VLAN traffic is untagged. A native VLAN mismatch causes CDP warnings and traffic leaking between VLANs, and is used in VLAN hopping attacks."},
{id:"c5",d:3,q:"How can you stop the native VLAN from being sent untagged on a trunk?",o:["vlan dot1q tag native","switchport trunk native vlan 1","switchport nonegotiate","no vlan 1"],a:[0],e:"vlan dot1q tag native (global) tags the native VLAN too, which blocks double-tagging VLAN hopping. Alternatively use an unused VLAN as native."},
{id:"c6",d:3,q:"A trunk carries VLANs 1-4094 by default. Which command restricts it to VLANs 10 and 20 only?",o:["switchport trunk allowed vlan 10,20","switchport trunk allowed vlan add 10,20","switchport access vlan 10,20","switchport trunk native vlan 10,20"],a:[0],e:"allowed vlan 10,20 replaces the list. allowed vlan add appends to an existing list, which is a common mistake that can wipe out VLANs if you forget 'add'."},
{id:"c7",d:3,q:"How many bytes does an 802.1Q tag add to an Ethernet frame?",o:["4","8","26","2"],a:[0],e:"The tag is 4 bytes: 2-byte TPID (0x8100) and 2-byte TCI with 3-bit PCP, 1-bit DEI, and 12-bit VLAN ID."},
{id:"c8",d:3,q:"Which two protocols can negotiate an EtherChannel? (Choose two.)",o:["LACP","PAgP","DTP","VTP","UDLD"],a:[0,1],e:"LACP (802.3ad/802.1AX, open standard) and PAgP (Cisco) negotiate bundles. You can also use mode on with no negotiation."},
{id:"c9",d:3,q:"Which LACP mode pairing brings up an EtherChannel?",o:["active and passive","passive and passive","on and active","desirable and active"],a:[0],e:"At least one side must be active. Passive/passive never sends LACPDUs. 'on' doesn't negotiate, so on with active won't bundle. Desirable is PAgP."},
{id:"c10",d:3,q:"Which PAgP mode pairing brings up an EtherChannel?",o:["desirable and auto","auto and auto","on and desirable","active and auto"],a:[0],e:"PAgP desirable initiates, auto responds. Auto/auto never forms a bundle."},
{id:"c11",d:3,q:"An EtherChannel won't form. Which mismatch between member ports is a common cause?",o:["Different speed, duplex, or trunk/VLAN settings","Different interface descriptions","Different port numbers","Different cable colors"],a:[0],e:"Member ports must match speed, duplex, switchport mode, allowed VLANs, and native VLAN. Mismatched ports are suspended."},
{id:"c12",d:3,q:"What is the maximum number of active links in a single LACP EtherChannel on most Catalyst switches?",o:["8 active, with up to 8 more in hot-standby","4 active","16 active with no standby","2 active"],a:[0],e:"LACP supports 16 members: 8 active and 8 standby. Standby links come up when an active one fails. PAgP supports 8."},
{id:"c13",d:3,q:"How does a switch decide which EtherChannel member link a frame uses?",o:["A hash of fields like source/destination MAC or IP, set by port-channel load-balance","Round robin per packet","The link with the lowest utilization","Always the lowest numbered port"],a:[0],e:"The hash keeps each flow on one link to avoid reordering. Choose src-dst-ip or similar to spread traffic across links well."},
{id:"c14",d:3,q:"What does 'show etherchannel summary' flag 'P' next to a member port mean?",o:["Bundled in port-channel","Suspended","Standalone","In hot-standby"],a:[0],e:"P = bundled, s = suspended, I = stand-alone, H = hot-standby, D = down. SU next to the Po means Layer 2 in use."},
{id:"c15",d:3,q:"In 802.1D STP, how is the root bridge elected?",o:["Lowest bridge ID (priority then MAC)","Highest bridge ID","Highest port speed","Lowest IP address"],a:[0],e:"Bridge ID = priority (default 32768 plus VLAN ID in PVST+) and MAC. Lowest wins. Set priority to control it, like spanning-tree vlan 10 root primary."},
{id:"c16",d:3,q:"What is the default STP bridge priority for VLAN 10 on a Cisco switch running PVST+?",o:["32778","32768","4096","0"],a:[0],e:"Extended system ID adds the VLAN number to the 32768 base, so VLAN 10 shows 32778. Priority must be set in multiples of 4096."},
{id:"c17",d:3,q:"In STP, which port on each non-root switch has the lowest cost path to the root?",o:["Root port","Designated port","Alternate port","Backup port"],a:[0],e:"Each non-root bridge picks one root port. Each segment picks one designated port. Remaining ports block (alternate/backup in RSTP)."},
{id:"c18",d:3,q:"What is the short-mode STP cost of a 1 Gbps link?",o:["4","19","2","100"],a:[0],e:"Short (802.1D-1998) costs: 10 Mbps 100, 100 Mbps 19, 1 Gbps 4, 10 Gbps 2. Long mode uses 20,000 for 1 Gbps."},
{id:"c19",d:3,q:"Which are the 802.1D STP port states in order a port moves through to forwarding?",o:["Blocking, listening, learning, forwarding","Discarding, learning, forwarding","Listening, blocking, learning, forwarding","Disabled, learning, listening, forwarding"],a:[0],e:"Classic STP: blocking (20s max age), listening (15s), learning (15s), forwarding, so up to 50 seconds. RSTP collapses to discarding, learning, forwarding."},
{id:"c20",d:3,q:"Which RSTP port role is a backup path to the root through a different switch?",o:["Alternate","Backup","Designated","Edge"],a:[0],e:"Alternate = backup to the root port via another bridge. Backup = backup for a designated port on the same shared segment."},
{id:"c21",d:3,q:"How does RSTP achieve fast convergence on point-to-point links?",o:["A proposal/agreement handshake that moves ports to forwarding without timers","By shortening the forward delay timer to 1 second","By disabling BPDUs","By using UDLD"],a:[0],e:"RSTP uses proposal/agreement with sync so designated ports can forward almost immediately on full-duplex point-to-point links."},
{id:"c22",d:3,q:"What is the main benefit of MST (802.1s) over Rapid PVST+?",o:["Many VLANs map to a few instances, which reduces STP CPU load","It gives each VLAN its own instance","It doesn't use BPDUs","It only works with one VLAN"],a:[0],e:"MST maps VLANs to a small number of instances. With hundreds of VLANs, PVST+ runs hundreds of STP instances; MST runs a few."},
{id:"c23",d:3,q:"For two switches to be in the same MST region, what must match?",o:["Region name, revision number, and VLAN-to-instance mapping","Only the region name","Only the bridge priority","The management VLAN"],a:[0],e:"Any mismatch in name, revision, or mapping puts them in different regions, and they interact like separate STP domains at the boundary."},
{id:"c24",d:3,q:"In MST, which instance interacts with other regions and legacy STP?",o:["IST (instance 0)","Instance 1","The highest numbered instance","Every instance equally"],a:[0],e:"The IST, MSTI 0, carries the BPDUs and represents the region to the outside (the CST). Other instances are internal only."},
{id:"c25",d:3,q:"A user plugged in a switch that took over as STP root. Which feature on the access port would have prevented that?",o:["Root guard","PortFast","UplinkFast","Storm control"],a:[0],e:"Root guard puts the port in root-inconsistent (blocking) if it receives a superior BPDU. It recovers when the superior BPDUs stop."},
{id:"c26",d:3,q:"What does BPDU guard do when a PortFast port receives a BPDU?",o:["Puts the port in err-disabled","Changes the port to a trunk","Ignores the BPDU","Makes the switch root"],a:[0],e:"BPDU guard protects edge ports from switches or loops. Recover with shutdown/no shutdown or errdisable recovery cause bpduguard."},
{id:"c27",d:3,q:"Which feature prevents an alternate or root port from moving to forwarding when BPDUs stop arriving due to a unidirectional link?",o:["Loop guard","Root guard","BPDU filter","PortFast"],a:[0],e:"Loop guard puts the port in loop-inconsistent instead of letting it become designated and forwarding, which would create a loop."},
{id:"c28",d:3,q:"What does 'spanning-tree portfast' do on an access port?",o:["Moves the port straight to forwarding, skipping listening and learning","Disables STP on the port completely","Turns the port into a trunk","Blocks all BPDUs"],a:[0],e:"PortFast is for end hosts. The port still participates in STP; if it gets a BPDU it loses edge status (and BPDU guard can disable it)."},
{id:"c29",d:3,q:"What is the risk of enabling BPDU filter on an interface?",o:["It stops sending and receiving BPDUs, so a loop can form undetected","It err-disables the port","It makes the switch root","It slows down convergence"],a:[0],e:"Interface-level BPDU filter effectively disables STP on the port. Global BPDU filter is safer because ports revert to normal STP if a BPDU arrives."},
{id:"c30",d:3,q:"Which feature detects a fiber link where one strand is broken and the switch only receives or only sends?",o:["UDLD","LACP","PortFast","DTP"],a:[0],e:"UDLD exchanges echo messages. In aggressive mode, a unidirectional link is err-disabled to prevent loops."},
{id:"c31",d:3,q:"Switch A has priority 4096 for VLAN 20. Which command makes switch B the backup root for VLAN 20?",o:["spanning-tree vlan 20 root secondary","spanning-tree vlan 20 priority 0","spanning-tree vlan 20 root primary","spanning-tree portfast"],a:[0],e:"root secondary sets priority 28672, which is lower than default but higher than a root primary. Note a manual 4096 on A means B at 28672 is backup."},
{id:"c32",d:3,q:"Which command shows which ports are forwarding or blocking for each VLAN and who the root is?",o:["show spanning-tree","show vlan brief","show interfaces trunk","show mac address-table"],a:[0],e:"show spanning-tree (or show spanning-tree vlan X) lists root ID, bridge ID, and each port's role, state, and cost."},
{id:"c33",d:3,q:"Which VTP mode can create VLANs but doesn't advertise them or sync from others, while still forwarding VTP messages?",o:["Transparent","Server","Client","Off"],a:[0],e:"Transparent switches keep local VLANs and forward VTP advertisements (in v2) without applying them. Off mode (v3) doesn't forward them."},
{id:"c34",d:3,q:"What risk does VTP pose when adding a used switch to the network?",o:["A higher configuration revision can overwrite the VLAN database across the domain","It disables STP","It changes the native VLAN","It resets passwords"],a:[0],e:"A switch in server or client mode with a higher revision and the same domain can wipe VLANs. Reset the revision first, or use transparent mode or VTPv3 primary server."},
{id:"c35",d:3,q:"Which command shows the trunk ports, their mode, native VLAN, and allowed VLANs?",o:["show interfaces trunk","show vlan brief","show spanning-tree","show etherchannel summary"],a:[0],e:"show interfaces trunk lists trunking ports, encapsulation, native VLAN, allowed VLANs, and VLANs forwarding after STP pruning."},
{id:"c36",d:3,q:"Two switches show the CDP error 'Native VLAN mismatch'. What happens to traffic?",o:["Untagged frames from one side land in a different VLAN on the other","The trunk goes down","All tagged VLANs are dropped","STP disables the link"],a:[0],e:"Untagged frames are placed in each side's native VLAN, so traffic crosses between VLANs. Always match native VLANs on both ends."},
{id:"c37",d:3,q:"Which configuration is a Layer 3 EtherChannel?",o:["interface Port-channel1 with 'no switchport' and an IP address, members also 'no switchport'","A port-channel with switchport mode trunk","A port-channel with spanning-tree portfast","Any EtherChannel using PAgP"],a:[0],e:"For a routed EtherChannel, both the Po and its members must be no switchport. The IP goes on the port-channel interface."},
{id:"c38",d:3,q:"In 802.1D, what are the default hello, max age, and forward delay timers?",o:["2, 20, and 15 seconds","1, 10, and 5 seconds","5, 30, and 15 seconds","2, 15, and 20 seconds"],a:[0],e:"Hello 2s, max age 20s, forward delay 15s. RSTP keeps hello 2s but treats 3 missed hellos (6s) as a failure."},
{id:"c39",d:3,q:"Two equal-cost paths lead to the root. Which is the tie-breaker order for selecting the root port?",o:["Lowest sender bridge ID, then lowest sender port priority, then lowest sender port number","Highest port speed, then lowest MAC","Lowest local port number only","Random"],a:[0],e:"After root path cost: lowest neighbor bridge ID, then lowest neighbor port priority, then lowest neighbor port number."},
{id:"c40",d:3,q:"Which Rapid PVST+ link type is assumed for a full-duplex port?",o:["Point-to-point","Shared","Edge","Boundary"],a:[0],e:"Full duplex = point-to-point, which allows proposal/agreement. Half duplex = shared, which falls back to slower timers."},
{id:"c41",d:3,q:"Which statement compares EIGRP and OSPF correctly?",o:["EIGRP is an advanced distance vector protocol; OSPF is link state","Both are link state","EIGRP uses areas; OSPF doesn't","OSPF supports unequal-cost load balancing by default"],a:[0],e:"EIGRP uses DUAL and only knows neighbors' views. OSPF floods LSAs so every router in an area has the full topology and runs SPF."},
{id:"c42",d:3,q:"What are the default administrative distances of internal EIGRP, OSPF, and eBGP?",o:["90, 110, 20","110, 90, 200","90, 120, 20","20, 110, 90"],a:[0],e:"Connected 0, static 1, eBGP 20, EIGRP internal 90, OSPF 110, IS-IS 115, RIP 120, EIGRP external 170, iBGP 200."},
{id:"c43",d:3,q:"Which EIGRP feature allows unequal-cost load balancing?",o:["variance","maximum-paths only","auto-summary","stub"],a:[0],e:"variance N includes feasible successors whose metric is less than N times the best metric. Only routes meeting the feasibility condition qualify."},
{id:"c44",d:3,q:"In EIGRP, what is the feasibility condition?",o:["A neighbor's reported distance must be less than the current feasible distance","The reported distance must equal the feasible distance","The neighbor must have the highest router ID","The route must be internal"],a:[0],e:"RD < FD guarantees the path is loop-free, so the neighbor can be a feasible successor and used instantly if the successor fails."},
{id:"c45",d:3,q:"By default, which K values does EIGRP use in its composite metric?",o:["K1 and K3 (bandwidth and delay)","K1, K2, K3, K4, K5","K2 and K4 (load and reliability)","Only K5"],a:[0],e:"Default K1=1, K3=1, others 0, so the metric depends on the slowest bandwidth and total delay along the path. K values must match to form a neighborship."},
{id:"c46",d:3,q:"Which OSPF network type elects a DR and BDR?",o:["Broadcast and non-broadcast","Point-to-point","Point-to-multipoint","Loopback"],a:[0],e:"Broadcast (Ethernet default) and NBMA elect DR/BDR. Point-to-point and point-to-multipoint don't."},
{id:"c47",d:3,q:"Two routers connected by a single Ethernet link show OSPF stuck in 2-WAY with DROTHER on both sides. What explains it?",o:["Both have OSPF priority 0, so no DR is elected","MTU mismatch","Area ID mismatch","Different hello timers"],a:[0],e:"With priority 0 on both, neither can be DR/BDR, so DROTHERs stay in 2-WAY. Setting ip ospf network point-to-point is the usual fix on a two-router link."},
{id:"c48",d:3,q:"OSPF neighbors are stuck in EXSTART/EXCHANGE. What is the most likely cause?",o:["MTU mismatch","Hello timer mismatch","Different process IDs","Different router IDs"],a:[0],e:"DBD packets carry the interface MTU. A mismatch stops the database exchange. Fix the MTU or use ip ospf mtu-ignore."},
{id:"c49",d:3,q:"Which parameters must match for OSPF neighbors to form an adjacency? (Choose two.)",o:["Area ID","Hello and dead intervals","Process ID","Router ID","Interface cost"],a:[0,1],e:"Must match: area, hello/dead timers, subnet/mask (on broadcast), authentication, stub flags, and MTU for full adjacency. Process ID is local; router IDs must be unique."},
{id:"c50",d:3,q:"How does OSPF choose its router ID?",o:["Manual router-id, else highest loopback IP, else highest active interface IP","Lowest interface IP","Process ID","MAC address of the first interface"],a:[0],e:"A manually set router-id wins. Otherwise the highest up loopback, then the highest up physical interface. The RID changes only after clear ip ospf process."},
{id:"c51",d:3,q:"What is the default OSPF reference bandwidth, and why change it?",o:["100 Mbps; otherwise all links 100 Mbps and faster get cost 1","1 Gbps; to make OSPF faster","10 Mbps; to match RIP","There is no reference bandwidth"],a:[0],e:"Cost = reference / interface bandwidth. With 100 Mbps, FastEthernet, 1G, and 10G all cost 1. Set auto-cost reference-bandwidth the same on all routers."},
{id:"c52",d:3,q:"Which OSPF LSA type is generated by every router and describes its own links in an area?",o:["Type 1 (Router)","Type 2 (Network)","Type 3 (Summary)","Type 5 (External)"],a:[0],e:"Type 1 lists the router's links. Type 2 is from the DR for a transit segment. Type 3 is inter-area from ABRs. Type 5 is external from ASBRs."},
{id:"c53",d:3,q:"Which router type generates Type 3 summary LSAs?",o:["ABR","ASBR","DR","Internal router"],a:[0],e:"ABRs summarize one area's routes into Type 3 LSAs for other areas."},
{id:"c54",d:3,q:"Which OSPF route type has the lowest preference (is chosen last) when the same prefix is learned several ways?",o:["E2 external","Intra-area (O)","Inter-area (O IA)","E1 external"],a:[0],e:"OSPF prefers intra-area, then inter-area, then E1/N1, then E2/N2, regardless of cost."},
{id:"c55",d:3,q:"What is the difference between OSPF E1 and E2 routes?",o:["E1 adds internal cost to the ASBR; E2 uses only the external seed metric","E2 adds internal cost; E1 doesn't","E1 is from another area; E2 is from another AS","There is no difference"],a:[0],e:"E2 (default) keeps the redistribution metric. E1 adds the cost to reach the ASBR, which is better when there are multiple exit points."},
{id:"c56",d:3,q:"Which command summarizes area 1 routes 10.1.0.0/16 on an ABR?",o:["area 1 range 10.1.0.0 255.255.0.0","summary-address 10.1.0.0 255.255.0.0","ip summary-address ospf 1 10.1.0.0 255.255.0.0","aggregate-address 10.1.0.0 255.255.0.0"],a:[0],e:"area range on the ABR summarizes inter-area routes. summary-address on the ASBR summarizes external routes."},
{id:"c57",d:3,q:"Which OSPF filtering method on an ABR stops specific Type 3 LSAs from entering an area?",o:["area X filter-list prefix NAME in","distribute-list in","passive-interface","ip ospf cost"],a:[0],e:"filter-list filters Type 3 LSAs at the ABR. A distribute-list in only keeps routes out of the local RIB; the LSAs are still in the database."},
{id:"c58",d:3,q:"What does 'passive-interface default' do in OSPF?",o:["Stops sending hellos on all interfaces unless you enable them with 'no passive-interface'","Shuts down all interfaces","Removes all networks from OSPF","Makes all interfaces point-to-point"],a:[0],e:"Passive interfaces still advertise their subnets but don't form neighbors. It's a common secure default for user-facing interfaces."},
{id:"c59",d:3,q:"How is OSPFv3 enabled on an interface, compared with OSPFv2?",o:["Directly on the interface (ipv6 ospf 1 area 0) instead of network statements","With network statements only","It runs over IPv4 only","It needs a VRF"],a:[0],e:"OSPFv3 is configured per interface, uses link-local addresses for neighbors, and still needs a 32-bit router ID. Address-family OSPFv3 can carry IPv4 too."},
{id:"c60",d:3,q:"Which OSPFv3 LSA types are new compared with OSPFv2?",o:["Link LSA (Type 8) and Intra-Area-Prefix LSA (Type 9)","Type 5 and Type 7","Type 1 and Type 2","Type 10 and Type 11"],a:[0],e:"OSPFv3 moved prefix information out of Types 1 and 2. Link LSAs carry link-local info; Intra-Area-Prefix LSAs carry the prefixes."},
{id:"c61",d:3,q:"Which OSPF area type blocks Type 5 LSAs and has the ABR inject a default route, but still allows Type 3 summaries?",o:["Stub area","Totally stubby area","NSSA","Backbone"],a:[0],e:"Stub blocks externals (Type 4/5). Totally stubby also blocks Type 3 except the default. NSSA allows a local ASBR with Type 7."},
{id:"c62",d:3,q:"Every non-backbone OSPF area must connect to area 0. What can be used temporarily if one can't?",o:["A virtual link through a transit area","A stub area","A GRE tunnel to area 2","An NSSA"],a:[0],e:"A virtual link logically connects a remote ABR to area 0 through a non-stub transit area. A GRE tunnel in area 0 is another option, but the virtual link is the OSPF feature."},
{id:"c63",d:3,q:"What TCP port does BGP use?",o:["179","89","520","646"],a:[0],e:"BGP runs over TCP 179. OSPF is IP protocol 89, RIP is UDP 520, LDP is 646."},
{id:"c64",d:3,q:"A BGP neighbor is stuck in Active state. What does that mean?",o:["The router is trying to open the TCP session but it isn't establishing","The session is established and exchanging routes","The neighbor is administratively shut down","BGP has converged"],a:[0],e:"Active means TCP isn't completing: wrong neighbor IP or AS, no route to the peer, ACL blocking 179, or update-source/multihop issues. Established is the goal."},
{id:"c65",d:3,q:"Two eBGP peers use loopbacks for the session. Which two commands are needed besides 'neighbor remote-as'? (Choose two.)",o:["neighbor x.x.x.x update-source Loopback0","neighbor x.x.x.x ebgp-multihop 2","neighbor x.x.x.x next-hop-self","neighbor x.x.x.x route-reflector-client","neighbor x.x.x.x send-community"],a:[0,1],e:"update-source sources TCP from the loopback, and since eBGP TTL is 1 by default, ebgp-multihop 2 (or disable-connected-check) lets it reach a loopback one hop away. Each side also needs a route to the other's loopback."},
{id:"c66",d:3,q:"What is the first BGP best path attribute Cisco routers compare?",o:["Highest weight","Highest local preference","Shortest AS path","Lowest MED"],a:[0],e:"Order: weight, local preference, locally originated, AS path length, origin, MED, eBGP over iBGP, IGP cost to next hop, then tie-breakers like oldest path and lowest router ID."},
{id:"c67",d:3,q:"Which BGP attribute is local to a router and not sent to any neighbor?",o:["Weight","Local preference","MED","AS path"],a:[0],e:"Weight is Cisco-proprietary and stays on the router. Local preference is shared within the AS via iBGP. MED is sent to an eBGP neighbor."},
{id:"c68",d:3,q:"An enterprise with two ISP links wants all its outbound traffic to prefer ISP A. Which attribute is best to set on routes from ISP A?",o:["Higher local preference","Higher MED","Longer AS path","Lower weight on all routers"],a:[0],e:"Local preference influences outbound path selection for the whole AS. To influence inbound traffic you'd use AS path prepending or MED toward the ISPs."},
{id:"c69",d:3,q:"How can an enterprise influence which ISP link incoming traffic uses?",o:["Prepend its own AS to routes advertised to the less-preferred ISP","Set a higher local preference on received routes","Set weight on its own routers","Use a lower administrative distance"],a:[0],e:"A longer AS path makes that path less attractive to the outside world. MED works only toward the same neighboring AS."},
{id:"c70",d:3,q:"What does the BGP 'network 10.1.0.0 mask 255.255.0.0' command require to advertise the prefix?",o:["An exact match for 10.1.0.0/16 in the routing table","Any subnet of 10.1.0.0 in the routing table","An interface in 10.1.0.0/16","Nothing; it always advertises"],a:[0],e:"BGP's network command needs an exact prefix and mask in the RIB. A common trick is a static route to Null0 for the aggregate."},
{id:"c71",d:3,q:"What is the iBGP split-horizon rule?",o:["Routes learned from an iBGP peer aren't advertised to other iBGP peers","Routes learned from eBGP aren't sent to iBGP","Routes aren't sent back out the interface they came in","iBGP routes have an AD of 20"],a:[0],e:"That's why iBGP needs a full mesh or route reflectors/confederations so every router learns every route."},
{id:"c72",d:3,q:"Why is 'neighbor x next-hop-self' often configured on an edge router toward its iBGP peers?",o:["eBGP routes keep the external next hop, which internal routers may not be able to reach","To change the AS number","To enable multihop","To prepend the AS"],a:[0],e:"iBGP doesn't change the next hop by default. Setting next-hop-self makes the edge router's address the next hop, which the IGP knows how to reach."},
{id:"c73",d:3,q:"Which command shows BGP neighbors, their state, and how many prefixes were received?",o:["show ip bgp summary","show ip route bgp","show ip bgp neighbors advertised-routes","show bgp ipv6"],a:[0],e:"The State/PfxRcd column shows a number when Established, or a state like Idle or Active when not."},
{id:"c74",d:3,q:"In 'show ip bgp' output, what does '>' mean next to a route?",o:["It's the best path","It's an internal route","It's suppressed","It's a RIB failure"],a:[0],e:"* = valid, > = best, i (in the status column) = iBGP learned, r = RIB failure. Origin codes at the end are i (IGP), e (EGP), ? (incomplete)."},
{id:"c75",d:3,q:"Which BGP origin code is preferred during best path selection?",o:["i (IGP)","e (EGP)","? (incomplete)","They're equal"],a:[0],e:"IGP < EGP < incomplete. Routes from the network command are i; redistributed routes are ?."},
{id:"c76",d:3,q:"What is policy-based routing (PBR) used for?",o:["Forwarding packets based on criteria like source address instead of only the destination","Summarizing routes","Filtering routing updates","Changing the administrative distance"],a:[0],e:"PBR uses a route-map applied with ip policy route-map on the ingress interface to set the next hop for matching traffic."},
{id:"c77",d:3,q:"Where is a PBR route-map applied?",o:["On the ingress interface with 'ip policy route-map NAME'","On the egress interface","Under the routing process","Globally with 'ip route-map'"],a:[0],e:"PBR acts on packets as they enter an interface. To policy-route router-generated traffic, use ip local policy route-map."},
{id:"c78",d:3,q:"What happens to packets that don't match any 'permit' sequence in a PBR route-map?",o:["They're routed normally using the routing table","They're dropped","They're sent to Null0","They use the default route only"],a:[0],e:"Unmatched or denied traffic in PBR just follows normal destination-based routing."},
{id:"c79",d:3,q:"When an OSPF router learns 10.1.1.0/24 from OSPF and 10.1.0.0/16 from EIGRP, which is used for a packet to 10.1.1.5?",o:["The OSPF /24, because longest match wins before AD","The EIGRP /16, because AD 90 is lower","Both, load balanced","Neither"],a:[0],e:"Different prefix lengths are different routes and both go in the RIB. Forwarding uses the longest match. AD only compares identical prefixes from different sources."},
{id:"c80",d:3,q:"What is an EIGRP stub router?",o:["A router that only advertises its connected/summary routes and isn't queried by neighbors","A router that blocks all routes","A router in OSPF area 0","A router with no neighbors"],a:[0],e:"Stubs limit query scope and aren't used as transit, which helps convergence and stability in hub-and-spoke designs."},
{id:"c81",d:3,q:"What does EIGRP 'Stuck in Active' (SIA) indicate?",o:["The router sent queries for a lost route and didn't get replies in time","The route is in the passive state","The neighbor's K values don't match","The router has no feasible successor configured"],a:[0],e:"Active means DUAL is querying. If a neighbor doesn't reply within the SIA timer, the neighbor is reset. Stubs and summaries limit query range."},
{id:"c82",d:3,q:"Which is the EIGRP multicast address for IPv4?",o:["224.0.0.10","224.0.0.5","224.0.0.9","224.0.0.18"],a:[0],e:"EIGRP 224.0.0.10, OSPF all routers 224.0.0.5 and DRs 224.0.0.6, RIPv2 224.0.0.9, VRRP 224.0.0.18."},
{id:"c83",d:3,q:"Which BGP attribute is sent to an eBGP neighbor to suggest which entry point into your AS they should use?",o:["MED","Local preference","Weight","Origin"],a:[0],e:"MED (multi-exit discriminator) is compared by the neighbor, lower is better, and by default only between paths from the same neighboring AS."},
{id:"c84",d:3,q:"Which statement about eBGP and iBGP is correct?",o:["eBGP peers are in different AS numbers; iBGP peers share the same AS","iBGP peers must be directly connected","eBGP uses AD 200","iBGP changes the next hop by default"],a:[0],e:"eBGP connects different ASes (AD 20, TTL 1 by default). iBGP runs within one AS (AD 200, peers often on loopbacks)."},
{id:"c85",d:3,q:"What is the purpose of the OSPF DR on a broadcast segment?",o:["Reduce adjacencies and LSA flooding: routers fully adjacent only with DR and BDR","Act as the default gateway","Run BGP for the area","Summarize routes"],a:[0],e:"DROTHERs send updates to 224.0.0.6 and the DR floods them to 224.0.0.5. Without a DR, n routers would need n(n-1)/2 adjacencies."},
