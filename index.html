{id:"c86",d:3,q:"A transmitter outputs 20 dBm. Roughly how many milliwatts is that?",o:["100 mW","20 mW","10 mW","1,000 mW"],a:[0],e:"0 dBm = 1 mW, 10 dBm = 10 mW, 20 dBm = 100 mW, 30 dBm = 1 W. Every +10 dB multiplies power by 10."},
{id:"c87",d:3,q:"Using the rule of 3s and 10s, what is 17 dBm in milliwatts?",o:["50 mW","34 mW","17 mW","100 mW"],a:[0],e:"+3 dB doubles power, -3 dB halves it. 17 dBm = 20 dBm - 3 dB = 100 mW / 2 = 50 mW."},
{id:"c88",d:3,q:"An AP transmits at 15 dBm, cable loss is 2 dB, and the antenna gain is 5 dBi. What is the EIRP?",o:["18 dBm","22 dBm","12 dBm","20 dBm"],a:[0],e:"EIRP = transmit power - cable loss + antenna gain = 15 - 2 + 5 = 18 dBm."},
{id:"c89",d:3,q:"A client's RSSI is -65 dBm and the noise floor is -92 dBm. What is the SNR?",o:["27 dB","-157 dB","157 dB","-27 dB"],a:[0],e:"SNR = signal - noise = -65 - (-92) = 27 dB. Higher is better; around 25 dB or more is typical for voice and data."},
{id:"c90",d:3,q:"Which RSSI value represents the strongest signal?",o:["-55 dBm","-67 dBm","-80 dBm","-90 dBm"],a:[0],e:"RSSI is negative dBm; closer to zero is stronger. -67 dBm is a common minimum design target for voice."},
{id:"c91",d:3,q:"Which 2.4 GHz channels are non-overlapping in North America?",o:["1, 6, and 11","1, 5, 9, and 13","2, 7, and 12","36, 40, 44, 48"],a:[0],e:"2.4 GHz channels are 20-22 MHz wide and spaced 5 MHz apart, so only 1, 6, 11 avoid overlap in the US. 36-48 are 5 GHz UNII-1 channels."},
{id:"c92",d:3,q:"What does an omnidirectional antenna's radiation pattern look like?",o:["A donut: 360 degrees horizontally with limited vertical coverage","A narrow beam in one direction","A half sphere pointing down only","A cone pointing up"],a:[0],e:"Omni dipoles radiate evenly around the antenna. Directional antennas (patch, Yagi, parabolic) focus energy for higher gain in one direction."},
{id:"c93",d:3,q:"Which antenna is best for a long point-to-point outdoor link between buildings?",o:["Parabolic dish or Yagi (highly directional)","Omnidirectional dipole","Ceiling-mount omni","Patch antenna aimed at the floor"],a:[0],e:"Highly directional antennas give high gain and narrow beamwidth for long bridges. Omnis spread energy all around."},
{id:"c94",d:3,q:"Which AP mode serves clients and also tunnels traffic to the WLC via CAPWAP in a campus?",o:["Local","Monitor","Sniffer","SE-Connect"],a:[0],e:"Local mode serves clients and scans off-channel periodically. Monitor mode doesn't serve clients; it scans for rogues and wIPS. Sniffer captures to an analyzer. SE-Connect does spectrum analysis."},
{id:"c95",d:3,q:"Which AP mode sends all captured 802.11 frames to a remote packet analyzer like Wireshark?",o:["Sniffer","Monitor","Bridge","FlexConnect"],a:[0],e:"Sniffer mode captures on one channel and forwards frames to a configured analyzer IP."},
{id:"c96",d:3,q:"Which AP mode is used for mesh or point-to-point wireless backhaul?",o:["Bridge (mesh)","Local","Sniffer","Monitor"],a:[0],e:"Bridge/mesh mode APs (RAP and MAP) build wireless backhaul links between APs."},
{id:"c97",d:3,q:"Which UDP ports does CAPWAP use?",o:["5246 for control and 5247 for data","5246 for data and 5247 for control","12222 and 12223","1812 and 1813"],a:[0],e:"CAPWAP control (DTLS encrypted) is UDP 5246, data is UDP 5247. 12222/12223 were LWAPP."},
{id:"c98",d:3,q:"What is the correct order of a lightweight AP joining a WLC?",o:["Get an IP, discover WLCs, select a WLC, join (DTLS), download image/config","Download image, get an IP, discover WLCs, join","Join, discover, get an IP","Discover WLCs before getting an IP"],a:[0],e:"The AP boots, gets an IP (DHCP or static), sends discovery requests, picks a WLC from responses, builds the DTLS CAPWAP tunnel and joins, then updates firmware and config if needed."},
{id:"c99",d:3,q:"Which two methods let an AP on a different subnet discover a WLC? (Choose two.)",o:["DHCP option 43","DNS lookup of CISCO-CAPWAP-CONTROLLER.localdomain","Subnet broadcast only","CDP from the switch","LLDP-MED power negotiation"],a:[0,1],e:"Layer 3 discovery uses DHCP option 43 (WLC IPs), DNS for CISCO-CAPWAP-CONTROLLER, a primed WLC list from a previous join, or the configured primary/secondary WLC. Broadcast only works on the local subnet."},
{id:"c100",d:3,q:"If an AP has primary, secondary, and tertiary WLCs configured, which does it try first?",o:["Primary","The least loaded WLC","The master controller","The tertiary"],a:[0],e:"Configured primary/secondary/tertiary override the other selection steps. If none are available, the AP may use a master controller or the least loaded WLC."},
{id:"c101",d:3,q:"A client moves between two APs on the same WLC and keeps its IP. What type of roam is this?",o:["Intra-controller roam","Layer 3 inter-controller roam","Anchor roam","Mobility tunnel roam"],a:[0],e:"Within one WLC the controller just updates the client's AP association. No mobility messaging between controllers is needed."},
{id:"c102",d:3,q:"A client roams to an AP on a different WLC where the WLAN maps to a different subnet. How does the client keep its IP?",o:["The original (anchor) WLC keeps the client entry and traffic is tunneled between the WLCs","The client always gets a new IP","The new WLC proxies ARP for the old subnet","It can't roam"],a:[0],e:"In a Layer 3 roam, the anchor WLC keeps the client's point of presence and the foreign WLC tunnels traffic back to it."},
{id:"c103",d:3,q:"Which mechanism lets clients roam quickly without a full 802.1X re-authentication on each AP?",o:["802.11r Fast BSS Transition (or OKC/CCKM)","802.11e","802.11h","802.11w"],a:[0],e:"802.11r pre-derives keys so roaming takes milliseconds, which matters for voice. 802.11w is Protected Management Frames, 802.11h is DFS/TPC."},
{id:"c104",d:3,q:"What must match between two WLCs for clients to roam between them seamlessly?",o:["Same mobility group and WLAN SSID/security settings","Same management IP","Same hostname","Same AP count"],a:[0],e:"Controllers must be mobility peers (same group or configured as peers) and have identical WLAN profiles for roaming."},
{id:"c105",d:3,q:"A wireless client can associate but never gets an IP address. What is the most likely place to check?",o:["The WLAN's VLAN/interface mapping and DHCP availability on that VLAN","The AP's antenna gain","The RF channel width","The SSID broadcast setting"],a:[0],e:"Association works but DHCP fails, so check the WLAN-to-VLAN mapping, the VLAN on the trunk to the WLC, and DHCP relay/server reachability."},
{id:"c106",d:3,q:"Which tool on the Catalyst 9800 shows a client's step-by-step connection stages like association, authentication, DHCP, and run?",o:["Client monitoring and RadioActive tracing","show cdp neighbors","show spanning-tree","debug ip ospf events"],a:[0],e:"The 9800 GUI shows client state (Run state is fully connected), and RadioActive tracing collects detailed per-client logs filtered by MAC."},
{id:"c107",d:3,q:"What is the final state when a wireless client is fully connected on a WLC?",o:["RUN","AUTHCHECK","DHCP_REQD","WEBAUTH_REQD"],a:[0],e:"Clients move through association, L2 auth, IP learning, (optional web auth), then RUN, where traffic flows."},
{id:"c108",d:3,q:"What does Radio Resource Management (RRM) on a WLC do automatically?",o:["Adjusts AP channels and transmit power and detects coverage holes","Assigns client IP addresses","Authenticates users","Configures VLANs on switches"],a:[0],e:"RRM includes DCA (channels), TPC (power), and coverage hole detection, based on what APs hear from each other."},
{id:"c109",d:3,q:"Which 802.11 standard is Wi-Fi 6 and adds OFDMA and BSS coloring?",o:["802.11ax","802.11ac","802.11n","802.11be"],a:[0],e:"Wi-Fi 4 = 802.11n, Wi-Fi 5 = 802.11ac, Wi-Fi 6/6E = 802.11ax, Wi-Fi 7 = 802.11be."},
{id:"c110",d:3,q:"Why does using 80 MHz channels in 5 GHz reduce capacity in a dense deployment?",o:["Fewer non-overlapping channels are available, so co-channel interference rises","80 MHz channels are slower","80 MHz isn't allowed in 5 GHz","Clients can't use 80 MHz"],a:[0],e:"Wider channels give higher per-client throughput but cut the number of channels for reuse. Dense sites usually use 20 or 40 MHz."},
{id:"c111",d:3,q:"What does free space path loss mean for wireless design?",o:["Signal strength drops as distance increases, faster at higher frequencies for the same antenna","Signal strength increases with distance","Walls don't affect signal","5 GHz travels farther than 2.4 GHz"],a:[0],e:"Loss grows with distance and frequency. 5 GHz cells are smaller than 2.4 GHz at the same power, and materials add absorption."},
{id:"c112",d:3,q:"Which RF behavior happens when a signal bounces off a metal surface?",o:["Reflection","Absorption","Refraction","Diffraction"],a:[0],e:"Reflection off metal and glass causes multipath. Absorption is lost energy in materials like water and concrete. Refraction bends through mediums; diffraction bends around obstacles."},
{id:"c113",d:3,q:"Which WLC interface (on AireOS) or concept is used by APs to build CAPWAP tunnels?",o:["Management interface (wireless management interface on 9800)","Service port","Virtual interface","Redundancy port"],a:[0],e:"APs join the WLC's management interface (Wireless Management Interface on the 9800). The virtual interface (like 192.0.2.1) is used for web auth and DHCP relay."},
{id:"c114",d:3,q:"On a Catalyst 9800, which three tags are applied to an AP to define its configuration?",o:["Policy tag, site tag, and RF tag","VLAN tag, QoS tag, and SSID tag","Primary, secondary, and tertiary tag","Mesh tag, bridge tag, and flex tag"],a:[0],e:"The policy tag maps WLANs to policy profiles, the site tag sets AP join profile and local vs FlexConnect, and the RF tag sets radio profiles."},
{id:"c115",d:3,q:"What is the switchport configuration for a local mode AP?",o:["Access port in the AP's VLAN","802.1Q trunk with all client VLANs","Routed port","Port-channel to the WLC"],a:[0],e:"Local mode APs tunnel all client traffic in CAPWAP, so they only need an access port. FlexConnect APs that locally switch multiple VLANs need a trunk."},
{id:"c116",d:3,q:"Which NTP stratum value means a device is unsynchronized?",o:["16","0","1","15"],a:[0],e:"Stratum 0 is the reference clock, stratum 1 is attached to it, each hop adds 1, and 16 means unsynchronized."},
{id:"c117",d:3,q:"Which command makes a router an NTP server for others using its own clock, even with no upstream source?",o:["ntp master 3","ntp server 10.1.1.1","ntp peer 10.1.1.1","clock set"],a:[0],e:"ntp master [stratum] makes the router an authoritative source using its internal clock. ntp server syncs from someone else."},
{id:"c118",d:3,q:"What is the difference between 'ntp server' and 'ntp peer'?",o:["ntp server syncs from the server only; ntp peer lets both devices sync from each other","They are the same","ntp peer is for IPv6","ntp server makes this device the master"],a:[0],e:"Client/server mode is one direction. Symmetric active (peer) mode lets either side sync the other, often used between redundant core devices."},
{id:"c119",d:3,q:"Which protocol provides sub-microsecond time accuracy, often used in industrial and financial networks?",o:["PTP (IEEE 1588)","NTPv3","SNTP","Syslog"],a:[0],e:"PTP uses hardware timestamping and boundary/transparent clocks to get far better accuracy than NTP's typical millisecond range."},
{id:"c120",d:3,q:"In PTP, which clock is selected as the time source for the whole domain?",o:["Grandmaster clock, chosen by the best master clock algorithm","Boundary clock","Transparent clock","Stratum 1 NTP server"],a:[0],e:"BMCA elects the grandmaster. Boundary clocks sync to it upstream and serve time downstream. Transparent clocks correct for their own residence time."},
{id:"c121",d:3,q:"In NAT terminology, what is the 'inside global' address?",o:["The public address that represents an inside host to the outside","The private address of the inside host","The real address of an outside host","An address in the DHCP pool"],a:[0],e:"Inside local = the host's private IP. Inside global = how it appears outside after NAT. Outside global = the remote host's real IP. Outside local = how the remote host appears inside."},
{id:"c122",d:3,q:"Which NAT type lets many inside hosts share one public IP by tracking port numbers?",o:["PAT (NAT overload)","Static NAT","Dynamic NAT with a pool","NAT64"],a:[0],e:"PAT translates source ports too, so thousands of sessions can share one address. Configure it with 'overload'."},
{id:"c123",d:3,q:"Which command configures PAT using the outside interface address?",o:["ip nat inside source list 1 interface Gi0/0 overload","ip nat outside source static 10.1.1.1 203.0.113.1","ip nat pool PUB 203.0.113.1 203.0.113.10","ip nat inside source static 10.1.1.1 interface Gi0/0"],a:[0],e:"The ACL defines inside traffic to translate, interface uses that interface's IP, and overload enables PAT. You also need ip nat inside and ip nat outside on the interfaces."},
{id:"c124",d:3,q:"A web server at 10.1.1.10 must always be reachable from the internet at 203.0.113.10. What should you configure?",o:["Static NAT: ip nat inside source static 10.1.1.10 203.0.113.10","PAT with overload","A dynamic NAT pool","NAT64"],a:[0],e:"Static NAT gives a permanent one-to-one mapping so outside hosts can start connections to the server."},
{id:"c125",d:3,q:"Users can't reach the internet after NAT was configured. 'show ip nat translations' is empty. What is a likely cause?",o:["Missing 'ip nat inside' / 'ip nat outside' on interfaces, or the ACL doesn't match the inside traffic","The NAT table is full","DNS is down","The router has too much memory"],a:[0],e:"With no translations at all, NAT isn't being triggered. Check interface roles, the ACL, and that traffic is actually routed out the outside interface."},
{id:"c126",d:3,q:"Which command clears dynamic NAT entries?",o:["clear ip nat translation *","clear nat all","no ip nat","reload nat"],a:[0],e:"clear ip nat translation * removes dynamic entries. Static entries stay because they're configured."},
{id:"c127",d:3,q:"What is the default HSRP priority, and does preemption happen by default?",o:["100, preemption off","100, preemption on","255, preemption off","0, preemption on"],a:[0],e:"Higher priority wins (then highest IP). Without 'standby X preempt', a higher priority router won't take over from an existing active."},
{id:"c128",d:3,q:"What virtual MAC address does HSRP version 1 use for group 10?",o:["0000.0c07.ac0a","0000.0c9f.f00a","0000.5e00.010a","0007.b400.0a01"],a:[0],e:"HSRPv1 uses 0000.0c07.acXX (XX = group in hex). HSRPv2 uses 0000.0c9f.fXXX. VRRP uses 0000.5e00.01XX. GLBP uses 0007.b400.XXYY."},
{id:"c129",d:3,q:"Which two features does HSRP version 2 add over version 1? (Choose two.)",o:["Group numbers up to 4095","IPv6 support","Load balancing across multiple gateways in one group","An open standard","Uses multicast 224.0.0.18"],a:[0,1],e:"HSRPv2 supports groups 0-4095, IPv6, and uses 224.0.0.102. HSRPv1 uses 224.0.0.2 and groups 0-255. Load balancing within one group is GLBP."},
{id:"c130",d:3,q:"Which FHRP is an open standard and lets the virtual IP be the same as a router's real interface IP?",o:["VRRP","HSRP","GLBP","CARP"],a:[0],e:"VRRP (RFC 5798) allows the master to own the virtual IP. VRRP preempts by default; HSRP doesn't."},
{id:"c131",d:3,q:"What is the VRRP default priority and does it preempt by default?",o:["100, preempt enabled","100, preempt disabled","255, preempt disabled","110, preempt enabled"],a:[0],e:"VRRP priority defaults to 100 (255 if it owns the address), and preemption is on by default."},
{id:"c132",d:3,q:"Which FHRP load balances traffic from hosts in one subnet across several routers using one virtual IP?",o:["GLBP","HSRP","VRRP","IRDP"],a:[0],e:"GLBP's active virtual gateway (AVG) answers ARP with different virtual MACs belonging to up to four active virtual forwarders (AVFs)."},
{id:"c133",d:3,q:"R1 is HSRP active with priority 110 and preempt. Its uplink fails, but it stays active and drops traffic. Which feature fixes this?",o:["Object tracking to decrement priority when the uplink fails","Increasing the hello timer","Using HSRPv1","Disabling preempt"],a:[0],e:"Track the uplink (or an IP SLA) with 'standby 1 track 1 decrement 20'. R1 drops to 90, and R2 (100, with preempt) takes over."},
{id:"c134",d:3,q:"What are the default HSRP hello and hold timers?",o:["3 and 10 seconds","1 and 3 seconds","5 and 15 seconds","10 and 40 seconds"],a:[0],e:"HSRP hellos every 3s with a 10s hold time. You can tune to milliseconds or pair with BFD for faster failover."},
{id:"c135",d:3,q:"Which multicast address range is reserved for local network control traffic and is never forwarded by routers?",o:["224.0.0.0/24","239.0.0.0/8","232.0.0.0/8","233.0.0.0/8"],a:[0],e:"224.0.0.0/24 is link-local (OSPF, EIGRP, HSRP). 232/8 is SSM, 239/8 is administratively scoped, 233/8 is GLOP."},
{id:"c136",d:3,q:"How is the multicast MAC address built from an IPv4 group address?",o:["01:00:5e followed by the low-order 23 bits of the group IP","The first 48 bits of the IP","ff:ff:ff:ff:ff:ff","00:00:0c followed by the group number"],a:[0],e:"Only 23 of the 28 group bits are mapped, so 32 IP groups share each MAC address."},
{id:"c137",d:3,q:"Which IGMP version adds support for source-specific joins (INCLUDE/EXCLUDE source lists)?",o:["IGMPv3","IGMPv2","IGMPv1","MLDv1"],a:[0],e:"IGMPv3 lets hosts specify sources, which is needed for SSM. IGMPv2 added leave messages and group-specific queries. MLDv2 is the IPv6 equivalent of IGMPv3."},
{id:"c138",d:3,q:"Which message did IGMPv2 add that IGMPv1 lacked?",o:["Leave Group","Membership Report","General Query","Source list"],a:[0],e:"IGMPv2 hosts send Leave messages, so the router can quickly check with a group-specific query instead of waiting for the membership to time out."},
{id:"c139",d:3,q:"What does IGMP snooping do on a switch?",o:["Forwards multicast only to ports with interested receivers instead of flooding the VLAN","Routes multicast between VLANs","Elects the RP","Translates IGMP to PIM"],a:[0],e:"The switch listens to IGMP reports and queries to build per-port group membership, cutting unnecessary multicast flooding."},
{id:"c140",d:3,q:"In PIM sparse mode, which device is the meeting point for sources and receivers before switching to the shortest path tree?",o:["Rendezvous point (RP)","Designated router on the receiver side only","IGMP querier","Bootstrap router"],a:[0],e:"Receivers' DRs join toward the RP (shared tree, *,G). Source DRs register with the RP. Last-hop routers can then switch to the SPT (S,G)."},
{id:"c141",d:3,q:"Which PIM mode floods multicast everywhere and then prunes where there are no receivers?",o:["Dense mode","Sparse mode","Source-specific multicast","Bidirectional PIM"],a:[0],e:"Dense mode is flood-and-prune, which suits dense receiver populations but scales poorly. Sparse mode uses explicit joins."},
{id:"c142",d:3,q:"What does Reverse Path Forwarding (RPF) check in multicast?",o:["That a multicast packet arrived on the interface the router would use to reach the source","That the destination group has receivers","That the TTL is above 1","That the RP is reachable"],a:[0],e:"If the packet didn't come in on the unicast path back to the source (or RP for shared trees), it's dropped. This prevents multicast loops."},
{id:"c143",d:3,q:"Which multicast model needs no RP because receivers specify both source and group?",o:["Source-Specific Multicast (SSM)","PIM sparse mode with Auto-RP","PIM dense mode","Bidirectional PIM"],a:[0],e:"SSM (232.0.0.0/8 by default) uses IGMPv3 (S,G) joins to build source trees directly."},
{id:"c144",d:3,q:"Which two methods dynamically distribute RP information to PIM routers? (Choose two.)",o:["Auto-RP","Bootstrap Router (BSR)","IGMP snooping","MSDP","CGMP"],a:[0,1],e:"Auto-RP (Cisco, 224.0.1.39/40) and BSR (standard) advertise group-to-RP mappings. MSDP shares source info between RPs; it doesn't distribute RP addresses."},
{id:"c145",d:3,q:"What does DHCP relay ('ip helper-address') forward by default besides DHCP?",o:["Several UDP broadcasts, including TFTP, DNS, NetBIOS, TACACS, and time","Only DHCP","All TCP traffic","ARP requests"],a:[0],e:"ip helper-address forwards eight UDP services by default (DHCP/BOOTP, TFTP, DNS, Time, NetBIOS name/datagram, TACACS). Use ip forward-protocol to change them."},
{id:"c146",d:3,q:"Which DHCP message does a client send first?",o:["DHCPDISCOVER","DHCPOFFER","DHCPREQUEST","DHCPACK"],a:[0],e:"DORA: Discover (client broadcast), Offer (server), Request (client), Ack (server)."},
{id:"c147",d:3,q:"Which IPv6 address type is automatically created on every IPv6-enabled interface and starts with FE80::/10?",o:["Link-local","Global unicast","Unique local","Multicast"],a:[0],e:"Link-local addresses are used for neighbor discovery and as routing protocol next hops. Global unicast is 2000::/3; unique local is FC00::/7."},
{id:"c148",d:3,q:"Which first hop redundancy feature is built into IPv6 without needing HSRP or VRRP?",o:["Router Advertisements with router preference and Neighbor Unreachability Detection","DHCPv6 relay","IPv6 ACLs","Duplicate Address Detection"],a:[0],e:"Hosts learn multiple routers from RAs and detect failure with NUD, though it's slower than an FHRP. HSRPv2 and VRRPv3 still support IPv6 for fast failover."},
{id:"c149",d:3,q:"In the HSRP output 'Active router is local, Standby router is 10.1.1.3, Virtual IP 10.1.1.1, Priority 110 (configured 110)', what is true?",o:["This router is active and forwards traffic for 10.1.1.1","10.1.1.3 forwards traffic for 10.1.1.1","Preemption is disabled","HSRP isn't working"],a:[0],e:"'Active router is local' means this router owns the virtual IP and MAC. 10.1.1.3 is standby and takes over if hellos stop."},
{id:"c150",d:3,q:"Which NAT translation is required for IPv6-only clients to reach IPv4 servers?",o:["NAT64 (stateful) with DNS64","Static NAT44","PAT","NPTv6"],a:[0],e:"NAT64 translates between IPv6 and IPv4 headers, and DNS64 creates synthetic AAAA records. NPTv6 is IPv6-to-IPv6 prefix translation."},
// ---------- Domain 4: Network Assurance ----------
{id:"d1",d:4,q:"You need to debug only traffic on interface Gi0/1 so the CPU isn't overwhelmed. Which feature helps?",o:["Conditional debugging: debug condition interface Gi0/1","debug all","logging buffered 4096","terminal no monitor"],a:[0],e:"Debug conditions limit output to a specific interface, IP, MAC, or user. Always be careful running debugs on production devices."},
{id:"d2",d:4,q:"You're SSH'd into a router and turned on a debug but see no output. What command do you need?",o:["terminal monitor","logging console","show debugging","service timestamps"],a:[0],e:"Debug and log messages go to the console by default. terminal monitor shows them on your vty session."},
{id:"d3",d:4,q:"Which command stops all running debugs?",o:["undebug all (or no debug all)","clear debug","debug off","terminal no monitor"],a:[0],e:"undebug all or u all turns everything off. terminal no monitor only stops display on your session; debugs keep running."},
{id:"d4",d:4,q:"An extended ping from R1 to 10.2.2.2 sourced from Loopback0 fails, but the normal ping works. What does this suggest?",o:["The far end has no return route to R1's loopback subnet","R1's interface is down","DNS failure","The far end's interface is shut"],a:[0],e:"A normal ping sources from the exit interface, which the far end can reach. Sourcing from the loopback tests whether the loopback is routed back."},
{id:"d5",d:4,q:"In Cisco ping output, what does a '.' mean?",o:["Timed out waiting for a reply","Successful reply","Destination unreachable","TTL expired"],a:[0],e:"! = success, . = timeout, U = destination unreachable, Q = source quench, M = could not fragment, ? = unknown packet type."},
{id:"d6",d:4,q:"In ping output, what does 'M' mean, and what test uses it?",o:["Could not fragment; useful when testing path MTU with the DF bit set","Multicast reply","Missed packet","Management VLAN"],a:[0],e:"Extended ping with DF set and increasing sizes reveals the path MTU. An M means a router needed to fragment but DF was set."},
{id:"d7",d:4,q:"How does traceroute discover each hop?",o:["It sends probes with increasing TTL and records the ICMP time-exceeded replies","It reads the routing table of each router","It uses CDP","It sends ARP requests"],a:[0],e:"Each router that decrements TTL to 0 sends ICMP time exceeded, revealing itself. Cisco IOS uses UDP probes to high ports by default."},
{id:"d8",d:4,q:"A traceroute shows '* * *' at hop 4, but later hops respond and the destination is reached. What is most likely?",o:["Hop 4 is rate-limiting or not sending ICMP time-exceeded","The path is broken at hop 4","The destination is down","There is a routing loop"],a:[0],e:"If later hops answer, traffic passes through hop 4. It just isn't replying, often due to ACLs or ICMP rate limits."},
{id:"d9",d:4,q:"What is the difference between SNMP polling and traps?",o:["Polls are manager-initiated GETs; traps are unsolicited messages the agent sends when events happen","Traps are requests from the manager","Polls only work in SNMPv3","Both are sent by the agent"],a:[0],e:"The NMS polls agents for MIB values (UDP 161). Agents send traps/informs to the NMS (UDP 162) when something happens."},
{id:"d10",d:4,q:"Which SNMP version adds authentication and encryption?",o:["SNMPv3","SNMPv2c","SNMPv1","SNMPv2 with communities"],a:[0],e:"SNMPv3 uses users with security levels: noAuthNoPriv, authNoPriv, and authPriv (auth plus encryption). v1/v2c use cleartext community strings."},
{id:"d11",d:4,q:"Which SNMPv3 security level provides both authentication and encryption?",o:["authPriv","authNoPriv","noAuthNoPriv","privNoAuth"],a:[0],e:"authPriv uses a hash (SHA) for authentication and a cipher (AES) for privacy. It's the recommended level."},
{id:"d12",d:4,q:"What is the difference between an SNMP trap and an inform?",o:["An inform is acknowledged by the manager and resent if not acknowledged; a trap isn't","A trap is acknowledged; an inform isn't","Informs are only in SNMPv1","There's no difference"],a:[0],e:"Informs (v2c/v3) need a response, so they're reliable but use more resources. Traps are fire-and-forget."},
{id:"d13",d:4,q:"Which SNMP operation does the manager use to efficiently retrieve large tables?",o:["GetBulk","GetNext only","Set","Trap"],a:[0],e:"GetBulk (v2c and later) retrieves many variables in one request. GetNext walks one object at a time."},
{id:"d14",d:4,q:"What does 'logging trap warnings' configure?",o:["Sends syslog messages of severity 0 through 4 to the syslog server","Sends only warning (4) messages","Sends SNMP traps for warnings","Logs only to the console"],a:[0],e:"Setting a level includes that level and everything more severe (lower number). So warnings = emergencies through warnings."},
{id:"d15",d:4,q:"What is syslog severity level 5?",o:["Notifications","Warnings","Errors","Informational"],a:[0],e:"0 Emergency, 1 Alert, 2 Critical, 3 Error, 4 Warning, 5 Notification, 6 Informational, 7 Debugging. Interface up/down messages are level 5 (LINEPROTO) or 3 (LINK)."},
{id:"d16",d:4,q:"In the log message '%LINK-3-UPDOWN: Interface Gi0/1, changed state to down', what does 3 mean?",o:["Severity level 3 (error)","The interface number","The facility number","The number of times it happened"],a:[0],e:"Format: %FACILITY-SEVERITY-MNEMONIC: description. LINK is the facility, 3 is error, UPDOWN is the mnemonic."},
{id:"d17",d:4,q:"Which transport and port does syslog use by default?",o:["UDP 514","TCP 514","UDP 162","TCP 601 only"],a:[0],e:"Classic syslog is UDP 514, which is unreliable. Some systems support TCP or TLS (6514) for reliable, secure delivery."},
{id:"d18",d:4,q:"Why should 'service timestamps log datetime msec' be configured with NTP?",o:["So log messages from different devices have accurate, comparable times","To reduce log volume","To encrypt logs","To send logs over TCP"],a:[0],e:"Correlating events across devices needs synchronized clocks and precise timestamps."},
{id:"d19",d:4,q:"What is NetFlow used for?",o:["Collecting per-flow statistics like who talks to whom, on what ports, and how much","Encrypting traffic","Mirroring every packet to an analyzer","Measuring jitter with probes"],a:[0],e:"NetFlow records flows (keyed by fields such as source/destination IP and port, protocol, ToS, and input interface) and exports them to a collector for traffic analysis and security."},
{id:"d20",d:4,q:"In traditional NetFlow v5, which fields define a unique flow?",o:["Seven key fields: source/destination IP, source/destination port, protocol, ToS, and input interface","Only source and destination IP","Only MAC addresses","The VLAN ID and CoS"],a:[0],e:"v5 has fixed keys. Flexible NetFlow (v9/IPFIX) lets you choose your own key and non-key fields."},
{id:"d21",d:4,q:"What are the three main components of Flexible NetFlow configuration, in order of how they're built?",o:["Flow record, flow exporter, flow monitor (applied to an interface)","Class map, policy map, service policy","Access list, route map, prefix list","Sampler, collector, analyzer"],a:[0],e:"The record defines match (key) and collect (non-key) fields. The exporter defines destination and transport. The monitor ties record and exporter together and is applied with ip flow monitor NAME input/output."},
{id:"d22",d:4,q:"In a Flexible NetFlow record, what is the difference between 'match' and 'collect'?",o:["match fields are keys that define a flow; collect fields are gathered as non-key data","match is for IPv6 and collect for IPv4","collect fields define the flow","They are interchangeable"],a:[0],e:"Example: match ipv4 source address and destination address (keys), collect counter bytes and packets (non-key)."},
{id:"d23",d:4,q:"Which NetFlow export version is template-based and the basis for IPFIX?",o:["Version 9","Version 5","Version 1","Version 7"],a:[0],e:"v9 uses templates so new fields can be exported. IPFIX (sometimes called v10) is the IETF standard based on v9."},
{id:"d24",d:4,q:"Which command applies a Flexible NetFlow monitor to ingress traffic on an interface?",o:["ip flow monitor MON1 input","flow monitor MON1","ip flow ingress","netflow apply MON1 in"],a:[0],e:"Under the interface: ip flow monitor NAME input (or output). ip flow ingress is legacy NetFlow."},
{id:"d25",d:4,q:"Which feature copies traffic from one port to another port on the same switch for an analyzer?",o:["Local SPAN","RSPAN","ERSPAN","NetFlow"],a:[0],e:"Local SPAN mirrors source ports or VLANs to a destination port on the same switch."},
{id:"d26",d:4,q:"Which feature mirrors traffic to an analyzer on a different switch using a dedicated VLAN?",o:["RSPAN","Local SPAN","ERSPAN","IP SLA"],a:[0],e:"RSPAN carries mirrored traffic in a special remote-span VLAN over trunks to the destination switch. It's Layer 2 only."},
{id:"d27",d:4,q:"Which feature mirrors traffic across a routed Layer 3 network by encapsulating it in GRE?",o:["ERSPAN","RSPAN","Local SPAN","VACL capture"],a:[0],e:"ERSPAN sends mirrored packets in GRE to a remote destination IP, so the analyzer can be anywhere routable."},
{id:"d28",d:4,q:"What happens to a SPAN destination port by default?",o:["It doesn't forward normal traffic or participate in STP; it only sends mirrored traffic","It works as a normal access port too","It becomes a trunk","It mirrors traffic back to the source"],a:[0],e:"Destination ports are dedicated to the analyzer. Incoming traffic is dropped unless you enable ingress forwarding."},
{id:"d29",d:4,q:"Which command sets up a local SPAN session copying Gi1/0/1 traffic in both directions to Gi1/0/24?",o:["monitor session 1 source interface Gi1/0/1 both, then monitor session 1 destination interface Gi1/0/24","span source Gi1/0/1 dest Gi1/0/24","ip flow monitor Gi1/0/24","remote-span Gi1/0/1"],a:[0],e:"Each session needs a source (rx, tx, or both) and a destination. RSPAN adds the remote vlan as source or destination."},
{id:"d30",d:4,q:"What must be configured on every switch carrying RSPAN traffic?",o:["The RSPAN VLAN with the 'remote-span' command, allowed on trunks","An ERSPAN ID","A GRE tunnel","IP routing"],a:[0],e:"Create the VLAN and mark it remote-span on source, intermediate, and destination switches so MAC learning is disabled and it carries mirrored traffic."},
{id:"d31",d:4,q:"What does IP SLA do?",o:["Generates synthetic probes to measure latency, jitter, loss, and reachability","Captures all packets on an interface","Exports flow records","Encrypts management traffic"],a:[0],e:"IP SLA operations (ICMP echo, UDP jitter, HTTP, DNS, etc.) run on a schedule. Results can feed object tracking for failover."},
{id:"d32",d:4,q:"Which IP SLA operation is best to measure jitter for voice paths?",o:["udp-jitter","icmp-echo","tcp-connect","dns"],a:[0],e:"UDP jitter sends timestamped packets and measures one-way delay, jitter, and loss. The far end needs ip sla responder."},
{id:"d33",d:4,q:"What must be configured on the far-end device for an IP SLA udp-jitter operation?",o:["ip sla responder","ip sla schedule","snmp-server enable traps","ntp master"],a:[0],e:"The responder answers the probes and adds timestamps, removing its own processing time from measurements. ICMP echo doesn't need it."},
{id:"d34",d:4,q:"A static default route should be removed if an ISP gateway 203.0.113.1 stops responding. What is needed?",o:["An IP SLA icmp-echo probe, a track object, and 'ip route 0.0.0.0 0.0.0.0 203.0.113.1 track 1'","Only a floating static route","HSRP on the ISP router","A NetFlow exporter"],a:[0],e:"The track object follows the IP SLA result. When the probe fails, the tracked route is removed and a floating static (higher AD) can take over."},
{id:"d35",d:4,q:"Which command starts IP SLA operation 1 now and runs it forever?",o:["ip sla schedule 1 life forever start-time now","ip sla 1 start","ip sla enable 1","track 1 ip sla 1 reachability"],a:[0],e:"An IP SLA does nothing until scheduled. The track command reads its result but doesn't start it."},
{id:"d36",d:4,q:"Which Catalyst Center feature gives a health score for network devices, clients, and applications?",o:["Assurance","Provision","Design","Policy"],a:[0],e:"Assurance collects telemetry, shows health scores and issues with suggested fixes, and keeps history for troubleshooting."},
{id:"d37",d:4,q:"What are the main workflow areas in Catalyst Center, in typical order?",o:["Design, Policy, Provision, Assurance","Provision, Design, Policy, Assurance","Assurance, Design, Provision, Policy","Policy, Assurance, Design, Provision"],a:[0],e:"Design sets the site hierarchy, settings, and images. Policy defines access and app policy. Provision pushes config to devices. Assurance monitors the result."},
{id:"d38",d:4,q:"In Catalyst Center Assurance, what lets you see what happened to a client at a point in the past?",o:["Time travel","Path trace only","Command runner","Template editor"],a:[0],e:"Assurance keeps historical data so you can go back in time to see a client's or device's state when the user reported the problem."},
{id:"d39",d:4,q:"Which Catalyst Center tool shows the hop-by-hop path between two endpoints, including ACLs along the way?",o:["Path Trace","Time travel","Image repository","Network hierarchy"],a:[0],e:"Path Trace calculates and visualizes the path, interface stats, and ACLs that could block the flow."},
{id:"d40",d:4,q:"Which NETCONF datastore holds the configuration that is actively running on the device?",o:["running","candidate","startup","intended"],a:[0],e:"Running is the active config. Candidate (if supported) holds staged changes for commit. Startup is used at boot."},
{id:"d41",d:4,q:"Which command enables NETCONF on an IOS XE device?",o:["netconf-yang","restconf","ip http secure-server only","netconf enable"],a:[0],e:"netconf-yang starts the NETCONF agent on TCP 830 over SSH. RESTCONF needs restconf plus ip http secure-server."},
{id:"d42",d:4,q:"Which TCP port does NETCONF over SSH use by default?",o:["830","22","443","8080"],a:[0],e:"NETCONF uses SSH subsystem 'netconf' on port 830. RESTCONF uses HTTPS 443."},
{id:"d43",d:4,q:"Which two commands are needed to enable RESTCONF on IOS XE? (Choose two.)",o:["restconf","ip http secure-server","netconf-yang","snmp-server enable","ip http client"],a:[0,1],e:"RESTCONF runs over HTTPS, so the secure HTTP server must be on. Users also need privilege 15 credentials or AAA authorization."},
{id:"d44",d:4,q:"Which encoding formats can RESTCONF use?",o:["JSON or XML","Only XML","Only YAML","CSV"],a:[0],e:"Set Accept and Content-Type to application/yang-data+json or application/yang-data+xml. NETCONF uses XML only."},
{id:"d45",d:4,q:"Which telemetry model has the device push data to a collector continuously instead of being polled?",o:["Model-driven streaming telemetry (dial-out or dial-in subscriptions)","SNMP polling","Syslog only","CLI screen scraping"],a:[0],e:"Streaming telemetry sends YANG-modeled data periodically or on change over gRPC, gNMI, or NETCONF, which scales better than polling."},
{id:"d46",d:4,q:"Which statement about SNMP community strings is correct?",o:["They're sent in cleartext in v1/v2c, so restrict them with ACLs and use read-only where possible","They're encrypted in SNMPv2c","They replace SSH passwords","They're only used for traps"],a:[0],e:"Communities are effectively passwords sent in clear. Use SNMPv3, or at least RO communities with an ACL limiting which NMS can poll."},
{id:"d47",d:4,q:"An engineer sees 'debug ip packet' output that's missing many packets. Why?",o:["CEF-switched packets aren't processed by the CPU, so debug ip packet only shows process-switched traffic","Debug only shows IPv6","The logging buffer is too big","Packets were encrypted"],a:[0],e:"Fast-path traffic bypasses the CPU. Use an ACL to limit debug ip packet, or use Embedded Packet Capture instead."},
{id:"d48",d:4,q:"Which IOS XE feature captures packets on a device and lets you export them as a pcap file?",o:["Embedded Packet Capture (monitor capture)","NetFlow","IP SLA","Syslog"],a:[0],e:"monitor capture CAP interface Gi1 both match any, start, then show or export the buffer to a pcap for Wireshark."},
{id:"d49",d:4,q:"What is the purpose of the 'logging buffered' command?",o:["Stores log messages in RAM on the device so 'show logging' can display them","Sends logs to a server","Disables console logging","Encrypts logs"],a:[0],e:"The buffer is lost on reload, so send important logs to a syslog server too."},
{id:"d50",d:4,q:"What is a key difference between Catalyst Center Assurance and SNMP-based monitoring?",o:["Assurance correlates streaming telemetry, logs, and flows into health scores and guided fixes","SNMP gives AI-driven root cause analysis","Assurance can only poll every 15 minutes","Assurance doesn't support wireless"],a:[0],e:"Assurance combines many data sources and analytics to point at the root cause, rather than just raw counters."},
// ---------- Domain 5: Security ----------
{id:"e1",d:5,q:"Which command stores the privileged EXEC password with the strongest hashing on modern IOS XE?",o:["enable algorithm-type scrypt secret MyP@ss","enable password MyP@ss","enable secret 7 MyP@ss","service password-encryption"],a:[0],e:"Type 9 (scrypt) and type 8 (PBKDF2-SHA256) are strong. Type 5 (MD5) is weaker. Type 7 (from service password-encryption) is easily reversed."},
{id:"e2",d:5,q:"What does 'service password-encryption' do?",o:["Applies weak, reversible type 7 encryption to plaintext passwords in the config","Hashes passwords with SHA-256","Encrypts SSH traffic","Encrypts the whole configuration file"],a:[0],e:"It only hides passwords from shoulder surfing. Type 7 can be decoded instantly, so use secret commands with strong hashing instead."},
{id:"e3",d:5,q:"Which two items are required before you can generate RSA keys for SSH on a Cisco router? (Choose two.)",o:["A hostname other than the default","An IP domain name","An enable password","A loopback interface","An NTP server"],a:[0,1],e:"The key label uses hostname.domain. Then crypto key generate rsa modulus 2048, ip ssh version 2, and transport input ssh on the vtys."},
{id:"e4",d:5,q:"Which line configuration allows only SSH for remote management?",o:["line vty 0 15 / transport input ssh","line vty 0 15 / transport input telnet","line con 0 / transport input ssh","line vty 0 15 / login"],a:[0],e:"transport input ssh blocks Telnet. Pair it with login local or AAA, and an access-class to restrict source IPs."},
{id:"e5",d:5,q:"Which command restricts which source IPs can SSH to the device's vty lines?",o:["access-class 10 in (under line vty)","ip access-group 10 in (under line vty)","ip access-group 10 in (on every interface)","ip ssh source-interface"],a:[0],e:"access-class applies a standard (or extended) ACL to vty lines. ip access-group is for interfaces."},
{id:"e6",d:5,q:"What does 'login local' under line vty do?",o:["Authenticates users against the local username database","Uses the line password","Uses RADIUS","Disables authentication"],a:[0],e:"Users need 'username X secret Y'. With AAA, the equivalent is aaa authentication login default local."},
{id:"e7",d:5,q:"What does 'exec-timeout 5 0' on a line do?",o:["Disconnects an idle session after 5 minutes","Allows only 5 sessions","Waits 5 seconds before showing the prompt","Locks the line for 5 minutes after failed logins"],a:[0],e:"Idle sessions are closed after minutes/seconds. exec-timeout 0 0 disables the timeout, which isn't recommended."},
{id:"e8",d:5,q:"Which protocol encrypts the entire payload between the device and the AAA server, and separates authentication, authorization, and accounting?",o:["TACACS+","RADIUS","LDAP","Kerberos"],a:[0],e:"TACACS+ (TCP 49) encrypts the whole body and allows per-command authorization, ideal for device administration. RADIUS encrypts only the password."},
{id:"e9",d:5,q:"Which protocol is typically used for network access control like 802.1X and VPN users?",o:["RADIUS","TACACS+","SNMP","Syslog"],a:[0],e:"RADIUS (UDP 1812/1813, or legacy 1645/1646) combines authentication and authorization and supports EAP, so it's used for user network access."},
{id:"e10",d:5,q:"Which ports does RADIUS use for authentication and accounting?",o:["UDP 1812 and 1813","TCP 49","UDP 49","TCP 1812 and 1813"],a:[0],e:"RADIUS uses UDP 1812 for auth and 1813 for accounting (older devices: 1645/1646). TACACS+ uses TCP 49."},
{id:"e11",d:5,q:"What does 'aaa authentication login default group tacacs+ local' do?",o:["Tries TACACS+ first, and uses the local database only if no TACACS+ server responds","Tries local first, then TACACS+","Requires both TACACS+ and local to succeed","Uses local if the TACACS+ password is wrong"],a:[0],e:"Methods are tried in order only if the previous one returns an error (unreachable). A reject from TACACS+ is final; it doesn't fall back."},
{id:"e12",d:5,q:"Which AAA function controls which commands an administrator can run?",o:["Authorization","Authentication","Accounting","Auditing"],a:[0],e:"Authentication = who you are. Authorization = what you can do (for example aaa authorization commands 15). Accounting = what you did."},
{id:"e13",d:5,q:"What must be configured first to use any 'aaa' commands on IOS?",o:["aaa new-model","aaa enable","radius-server host","ip domain-name"],a:[0],e:"aaa new-model enables AAA. It immediately applies default local login to lines, so have a local user configured first."},
{id:"e14",d:5,q:"Which privilege level is full administrative access on IOS?",o:["15","1","0","7"],a:[0],e:"Level 1 is user EXEC, level 15 is privileged EXEC. Levels 2-14 can be customized with specific commands."},
{id:"e15",d:5,q:"What is the purpose of Control Plane Policing (CoPP)?",o:["Rate-limits or filters traffic destined to the device's CPU to protect it from attacks or floods","Polices user data traffic through the device","Encrypts routing protocol traffic","Assigns QoS markings to voice"],a:[0],e:"CoPP applies an MQC policy to the control-plane interface, so routing protocols and management stay healthy under a flood."},
{id:"e16",d:5,q:"Where is a CoPP policy applied?",o:["control-plane, with service-policy input","On every physical interface inbound","On the vty lines","Under router ospf"],a:[0],e:"control-plane then service-policy input COPP-POLICY. The classes typically separate routing, management, and ICMP with different police rates."},
{id:"e17",d:5,q:"Which ACL type can filter only on source IP address?",o:["Standard ACL","Extended ACL","Named extended ACL","MAC ACL"],a:[0],e:"Standard ACLs (1-99, 1300-1999) match source only, so place them close to the destination. Extended ACLs (100-199, 2000-2699) match source, destination, protocol, and ports."},
{id:"e18",d:5,q:"What is at the end of every IPv4 ACL?",o:["An implicit deny any","An implicit permit any","Nothing","An implicit log statement"],a:[0],e:"If no line matches, the packet is denied. IPv6 ACLs also have implicit permits for neighbor discovery before the final deny."},
{id:"e19",d:5,q:"Which wildcard mask matches all hosts in 192.168.10.0/26?",o:["0.0.0.63","0.0.0.64","255.255.255.192","0.0.0.255"],a:[0],e:"Wildcard = inverse of the mask: 255.255.255.255 - 255.255.255.192 = 0.0.0.63."},
{id:"e20",d:5,q:"Where should extended ACLs generally be placed?",o:["Close to the source of the traffic","Close to the destination","Only on the core","Only on loopbacks"],a:[0],e:"Extended ACLs are specific enough to place near the source, dropping unwanted traffic before it crosses the network."},
{id:"e21",d:5,q:"An ACL has 'deny tcp any host 10.1.1.10 eq 80' then 'permit ip any any'. What happens to HTTPS traffic to 10.1.1.10?",o:["It's permitted","It's denied","It's logged and dropped","It's sent to the CPU"],a:[0],e:"HTTPS is TCP 443, which doesn't match the eq 80 line, so it hits permit ip any any."},
{id:"e22",d:5,q:"Which ACL entry permits return traffic for TCP sessions started from inside, without being stateful?",o:["permit tcp any any established","permit tcp any any eq 80","permit ip any any log","deny tcp any any syn"],a:[0],e:"established matches packets with ACK or RST set. It's a simple filter, not true stateful inspection like a firewall or reflexive ACL."},
{id:"e23",d:5,q:"Which command applies ACL 101 to filter traffic entering interface Gi0/0?",o:["ip access-group 101 in (under the interface)","access-class 101 in","ip access-list 101 in","service-policy input 101"],a:[0],e:"Each interface can have one ACL per direction per protocol."},
{id:"e24",d:5,q:"What is a key benefit of a named ACL over a numbered one?",o:["You can add or delete individual lines using sequence numbers and give it a descriptive name","It processes faster","It doesn't have an implicit deny","It works on Layer 2 only"],a:[0],e:"Named ACLs (and numbered ones in ip access-list mode) support sequence number editing. Names make the purpose clear."},
{id:"e25",d:5,q:"Which two security features are commonly recommended for REST API access to network controllers? (Choose two.)",o:["HTTPS (TLS) to encrypt API traffic","Token-based authentication such as OAuth or an API token","Basic HTTP over port 80","Sharing one admin account for all scripts","Disabling certificate checks"],a:[0,1],e:"Use TLS for confidentiality and tokens with expiry for authentication. Give scripts their own least-privilege accounts and validate certificates."},
{id:"e26",d:5,q:"How does a client typically authenticate to the Catalyst Center API?",o:["POST credentials (basic auth) to the token endpoint, then send the returned token in the X-Auth-Token header","Send the username in every URL","Use SNMP community strings","Use a NETCONF hello"],a:[0],e:"POST /dna/system/api/v1/auth/token with basic auth returns a token. Later calls include X-Auth-Token. Tokens expire (about 1 hour)."},
{id:"e27",d:5,q:"Which HTTP status code means the client is authenticated but not allowed to access the resource?",o:["403 Forbidden","401 Unauthorized","404 Not Found","200 OK"],a:[0],e:"401 = missing or bad credentials. 403 = credentials fine, permission denied."},
{id:"e28",d:5,q:"Which wireless security method uses a shared passphrase for all users?",o:["WPA2/WPA3-Personal (PSK/SAE)","WPA2-Enterprise with 802.1X","Web authentication with ISE","EAP-TLS"],a:[0],e:"Personal mode uses one pre-shared key (WPA2-PSK) or SAE (WPA3). Enterprise mode authenticates each user with 802.1X/EAP."},
{id:"e29",d:5,q:"What does WPA3-Personal use instead of PSK, and what attack does it protect against?",o:["SAE (Simultaneous Authentication of Equals), resisting offline dictionary attacks","TKIP, resisting replay attacks","WEP keys, resisting eavesdropping","MAB, resisting spoofing"],a:[0],e:"SAE uses a Dragonfly handshake so a captured handshake can't be brute-forced offline, and it provides forward secrecy."},
{id:"e30",d:5,q:"Which cipher does WPA2 use?",o:["AES-CCMP","TKIP only","RC4","DES"],a:[0],e:"WPA2 requires CCMP (AES). TKIP/RC4 were WPA1 and WEP. WPA3 uses CCMP-128 (Personal) or GCMP-256 (Enterprise 192-bit mode)."},
{id:"e31",d:5,q:"Which EAP method requires certificates on both the client and the server?",o:["EAP-TLS","PEAP","EAP-FAST","LEAP"],a:[0],e:"EAP-TLS uses mutual certificate authentication, the strongest common method. PEAP and EAP-TTLS need only a server cert and tunnel an inner password method."},
{id:"e32",d:5,q:"Which EAP method builds a TLS tunnel with a server certificate and then authenticates the user with MSCHAPv2 inside it?",o:["PEAP","EAP-TLS","EAP-MD5","LEAP"],a:[0],e:"PEAP (PEAPv0/EAP-MSCHAPv2) is common in Windows environments with AD credentials."},
{id:"e33",d:5,q:"Which Cisco EAP method can use a Protected Access Credential (PAC) instead of certificates?",o:["EAP-FAST","EAP-TLS","PEAP","EAP-TTLS"],a:[0],e:"EAP-FAST uses a PAC to build the tunnel, with optional certificates. It was designed to replace LEAP."},
{id:"e34",d:5,q:"In 802.1X, what are the three roles?",o:["Supplicant, authenticator, authentication server","Client, access point, DHCP server","User, switch, firewall","Requester, relay, responder"],a:[0],e:"The supplicant (client) talks EAPoL to the authenticator (switch or WLC), which relays EAP in RADIUS to the authentication server (ISE)."},
{id:"e35",d:5,q:"Which protocol carries EAP between the supplicant and the switch?",o:["EAPoL (EAP over LAN)","RADIUS","TACACS+","CAPWAP"],a:[0],e:"EAPoL is Layer 2 between client and authenticator. The switch encapsulates EAP in RADIUS toward the server."},
{id:"e36",d:5,q:"A printer doesn't support 802.1X. Which method lets the switch authenticate it?",o:["MAC Authentication Bypass (MAB)","EAP-TLS","PEAP","WebAuth"],a:[0],e:"MAB sends the device MAC as username/password to RADIUS. It's weaker since MACs can be spoofed, so pair it with profiling and restrictive policy."},
{id:"e37",d:5,q:"Which authentication method is commonly used for guest users who open a browser and log in through a portal?",o:["Web authentication (WebAuth)","802.1X EAP-TLS","MAB","WPA3-Enterprise"],a:[0],e:"Local or central WebAuth redirects HTTP to a captive portal. ISE's central WebAuth uses MAB first, then a redirect URL and ACL."},
{id:"e38",d:5,q:"On a switch port configured for 802.1X with MAB fallback, what is the default order of methods?",o:["802.1X first, then MAB after the 802.1X timeout","MAB first, then 802.1X","WebAuth first","All at once"],a:[0],e:"By default the port tries dot1x, then falls back to MAB if no EAPoL response. 'authentication order mab dot1x' can change it for faster MAB of headless devices."},
{id:"e39",d:5,q:"What is Cisco TrustSec?",o:["A framework that classifies traffic with Security Group Tags and enforces policy by group instead of IP address","A VPN client","A wireless encryption method","A firewall operating system"],a:[0],e:"TrustSec assigns SGTs at ingress (via 802.1X/MAB or static mapping), propagates them inline or via SXP, and enforces SGACLs at egress."},
{id:"e40",d:5,q:"How are SGTs carried between devices that don't support inline tagging?",o:["SXP (SGT Exchange Protocol) shares IP-to-SGT bindings over TCP","Through VLAN tags","Through DSCP markings","Through CDP"],a:[0],e:"SXP (TCP 64999) sends IP-SGT mappings from a speaker to a listener when hardware can't insert the CMD (Cisco metadata) header."},
{id:"e41",d:5,q:"Where is an SGACL typically enforced in TrustSec?",o:["At egress, near the destination","At ingress, near the source","Only at the internet firewall","On the RADIUS server"],a:[0],e:"Tags are assigned at ingress, carried across, and the egress device enforces the source SGT to destination SGT policy."},
{id:"e42",d:5,q:"What does MACsec (802.1AE) provide?",o:["Hop-by-hop Layer 2 encryption and integrity between directly connected devices","End-to-end encryption between hosts across the internet","Wireless encryption","Port security for MAC addresses"],a:[0],e:"MACsec encrypts frames on a link. Each hop decrypts and re-encrypts, so devices can still inspect traffic. Keys can come from 802.1X (MKA)."},
{id:"e43",d:5,q:"Which protocol distributes MACsec keys?",o:["MKA (MACsec Key Agreement)","IKEv2","SAE","TLS"],a:[0],e:"MKA (802.1X-2010) handles key discovery and exchange for MACsec, using keys from 802.1X EAP or a pre-shared CAK."},
{id:"e44",d:5,q:"What is a next-generation firewall (NGFW) able to do that a traditional stateful firewall can't?",o:["Identify and control applications, users, and threats with features like IPS, URL filtering, and malware inspection","Track TCP state","Filter by port number","Perform NAT"],a:[0],e:"NGFWs add application visibility (AVC), intrusion prevention, URL categories, identity awareness, and advanced malware protection."},
{id:"e45",d:5,q:"Which Cisco solution provides endpoint protection with continuous file analysis and retrospective detection?",o:["Cisco Secure Endpoint (formerly AMP for Endpoints)","Cisco Umbrella","Cisco ISE","Cisco Stealthwatch"],a:[0],e:"Secure Endpoint checks file reputation, sandboxes, and can retroactively flag files that later turn out to be malicious."},
{id:"e46",d:5,q:"Which Cisco solution protects users at the DNS layer by blocking requests to malicious domains?",o:["Cisco Umbrella","Cisco Secure Endpoint","Cisco ISE","Catalyst Center"],a:[0],e:"Umbrella resolves DNS and blocks known-bad or categorized domains before a connection is even made, on or off network."},
{id:"e47",d:5,q:"Which Cisco solution uses NetFlow and telemetry to detect anomalies and threats inside the network?",o:["Cisco Secure Network Analytics (Stealthwatch)","Cisco Umbrella","Cisco Secure Email","Cisco Duo"],a:[0],e:"Secure Network Analytics builds baselines from flow data and flags unusual behavior like data exfiltration or lateral movement."},
{id:"e48",d:5,q:"Which Cisco product is the policy server for 802.1X, MAB, WebAuth, profiling, and posture?",o:["Cisco ISE","Cisco Umbrella","Cisco Firepower Management Center","Catalyst Center"],a:[0],e:"ISE is the AAA and policy engine. It also assigns SGTs and integrates with Catalyst Center and firewalls."},
{id:"e49",d:5,q:"Which Cisco solution adds multifactor authentication with push approvals on a phone?",o:["Cisco Duo","Cisco Umbrella","Cisco Secure Endpoint","Cisco Stealthwatch"],a:[0],e:"Duo provides MFA and device trust checks for applications and VPNs, part of a zero-trust approach."},
{id:"e50",d:5,q:"Which email-focused Cisco security product filters spam, phishing, and malicious attachments?",o:["Cisco Secure Email (formerly ESA)","Cisco Secure Web Appliance","Cisco ISE","Cisco Umbrella"],a:[0],e:"Secure Email inspects inbound and outbound mail with reputation filters, antivirus, and sandboxing."},
{id:"e51",d:5,q:"Which feature limits the number of MAC addresses learned on an access port and can shut the port on violation?",o:["Port security","DHCP snooping","Storm control","BPDU guard"],a:[0],e:"switchport port-security maximum N with a violation mode. Default mode is shutdown (err-disable)."},
{id:"e52",d:5,q:"Which port security violation mode drops offending frames, sends a log/SNMP message, increments the counter, but keeps the port up?",o:["restrict","protect","shutdown","shutdown vlan"],a:[0],e:"protect drops silently, restrict drops and logs, shutdown err-disables the port (default), shutdown vlan disables only the violating VLAN."},
{id:"e53",d:5,q:"What does 'switchport port-security mac-address sticky' do?",o:["Dynamically learned MACs are added to the running config as secure addresses","MACs are learned but forgotten after aging","It disables MAC learning","It shares MACs between switches"],a:[0],e:"Sticky MACs survive in the running config. Save to startup to keep them after a reload."},
{id:"e54",d:5,q:"Which ports should be trusted for DHCP snooping?",o:["Uplinks toward legitimate DHCP servers","All access ports","Ports connected to user PCs","None"],a:[0],e:"Untrusted ports drop server messages like OFFER and ACK, blocking rogue DHCP servers. Trust uplinks and server-facing ports."},
{id:"e55",d:5,q:"What does IP Source Guard prevent?",o:["Hosts sending traffic with a spoofed source IP not in the DHCP snooping binding table","Rogue DHCP servers","ARP poisoning","STP attacks"],a:[0],e:"IPSG filters by IP (and optionally MAC) per port, using DHCP snooping bindings or static entries."},
{id:"e56",d:5,q:"Which attack does Dynamic ARP Inspection stop?",o:["ARP spoofing / man-in-the-middle by poisoning ARP caches","MAC flooding","VLAN hopping","DHCP starvation"],a:[0],e:"DAI checks ARP packets on untrusted ports against DHCP snooping bindings (or ARP ACLs) and drops invalid ones."},
{id:"e57",d:5,q:"An attacker floods a switch with fake source MACs to fill the CAM table so the switch floods traffic. What mitigates this?",o:["Port security limiting MACs per port","DHCP snooping","Root guard","BFD"],a:[0],e:"A full CAM table makes the switch flood unknown unicast like a hub. Limiting MACs per port stops the attack at the edge."},
{id:"e58",d:5,q:"Which two actions mitigate VLAN hopping by switch spoofing and double tagging? (Choose two.)",o:["Set access ports to 'switchport mode access' and disable DTP","Use a dedicated unused VLAN as the native VLAN on trunks","Enable PortFast on trunks","Use VLAN 1 for user traffic","Enable VTP server mode"],a:[0,1],e:"Disable DTP so attackers can't form a trunk. Double tagging relies on the attacker's access VLAN being the trunk's native VLAN, so change or tag the native VLAN."},
{id:"e59",d:5,q:"Which feature limits broadcast, multicast, or unknown unicast traffic to a percentage of port bandwidth?",o:["Storm control","Port security","CoPP","UDLD"],a:[0],e:"storm-control broadcast level 1.00 drops broadcasts above 1% and can shut the port or send a trap."},
{id:"e60",d:5,q:"What is a private VLAN used for?",o:["Isolating hosts in the same subnet from each other while they still reach the gateway","Creating encrypted VLANs","Hiding VLANs from VTP","Carrying management traffic only"],a:[0],e:"Isolated ports can only talk to promiscuous ports (the gateway). Community ports talk within their community and to promiscuous ports."},
{id:"e61",d:5,q:"Which zone-based firewall statement is correct by default?",o:["Traffic between two different zones is denied unless a zone-pair policy allows it","All traffic between zones is allowed","Traffic within the same zone is denied","Traffic to the router itself is denied"],a:[0],e:"ZBFW denies inter-zone traffic by default. Intra-zone traffic is allowed. The self zone (router itself) is allowed unless you define a policy for it."},
{id:"e62",d:5,q:"In a zone-based firewall, which action tracks sessions so return traffic is automatically allowed?",o:["inspect","pass","drop","police"],a:[0],e:"inspect is stateful. pass allows traffic one way only, so you'd need a return policy. drop discards."},
{id:"e63",d:5,q:"Which statement about Cisco's zero-trust approach is accurate?",o:["Never trust by default; verify user, device, and context continuously before granting least-privilege access","Trust everything inside the firewall","Only use passwords for authentication","Rely only on perimeter firewalls"],a:[0],e:"Zero trust covers workforce (Duo), workplace (ISE/TrustSec), and workload (segmentation) with continuous verification."},
{id:"e64",d:5,q:"What does ISE profiling do?",o:["Identifies endpoint types (printer, IP phone, camera) from attributes like DHCP, CDP, HTTP, and RADIUS","Encrypts endpoint traffic","Updates endpoint software","Assigns IP addresses"],a:[0],e:"Profiling lets ISE apply policy by device type, which is useful for MAB devices that can't do 802.1X."},
{id:"e65",d:5,q:"What does ISE posture assessment check?",o:["Whether an endpoint meets compliance requirements like antivirus and OS patches before full access","The endpoint's physical location","The switch's IOS version","The RF signal strength"],a:[0],e:"Non-compliant endpoints can be quarantined or sent to remediation until they pass."},
{id:"e66",d:5,q:"What is RADIUS Change of Authorization (CoA) used for?",o:["Letting ISE change a session's authorization after login, like reauthenticating or bouncing a port","Changing the RADIUS shared secret","Changing the user's password","Switching from RADIUS to TACACS+"],a:[0],e:"CoA (RFC 5176, UDP 1700 on Cisco or 3799) lets the server push new policy, for example after posture or profiling changes."},
{id:"e67",d:5,q:"Which two items describe the 'aaa authorization exec default group tacacs+ local' command? (Choose two.)",o:["It determines whether a user gets an EXEC shell and at what privilege","It checks TACACS+ first and falls back to local if the server is unreachable","It authenticates users","It logs every command","It encrypts the session"],a:[0,1],e:"Exec authorization assigns the shell and privilege level after login. Command authorization and accounting are separate configs."},
{id:"e68",d:5,q:"Which TACACS+ feature lets you record every command an administrator types?",o:["aaa accounting commands 15 default start-stop group tacacs+","aaa authentication login","aaa authorization network","logging buffered"],a:[0],e:"Command accounting sends each command at the given privilege level to the TACACS+ server for audit."},
{id:"e69",d:5,q:"Which wireless attack sets up a fake AP with a legitimate SSID to capture user credentials?",o:["Evil twin / rogue AP","MAC flooding","VLAN hopping","Smurf attack"],a:[0],e:"WLCs detect rogues using monitor-mode or local-mode APs. 802.1X with server certificate validation on clients protects credentials."},
{id:"e70",d:5,q:"Which 802.11 amendment protects management frames like deauthentication from spoofing?",o:["802.11w (Protected Management Frames)","802.11r","802.11k","802.11i only"],a:[0],e:"PMF prevents spoofed deauth/disassoc attacks. It's required for WPA3."},
{id:"e71",d:5,q:"On a Catalyst 9800, which configuration supports guest access with a local web portal?",o:["A WLAN with Layer 3 web authentication and a web auth parameter map","A WLAN with WPA2-Enterprise only","A FlexConnect ACL","A RF profile"],a:[0],e:"Local WebAuth uses a parameter map (internal or custom pages). Central WebAuth uses ISE with MAC filtering plus a redirect."},
{id:"e72",d:5,q:"Which wireless security option is best for corporate laptops in an enterprise?",o:["WPA2/WPA3-Enterprise with 802.1X EAP-TLS","WPA2-Personal","Open with MAC filtering","WEP 128"],a:[0],e:"Per-user certificates with EAP-TLS give strong mutual authentication and unique keys per session, and access can be revoked per device."},
{id:"e73",d:5,q:"What does the 'authenticator' do in a wireless 802.1X exchange on a Cisco network?",o:["The WLC (or AP in FlexConnect local auth) relays EAP between the client and RADIUS","The client sends credentials to Active Directory","ISE associates the client","The AP generates the certificate"],a:[0],e:"The WLC is the authenticator. After success, the PMK from RADIUS lets the AP/WLC and client run the 4-way handshake for encryption keys."},
{id:"e74",d:5,q:"In the WPA2 4-way handshake, what is derived?",o:["The PTK (pairwise transient key) used to encrypt unicast traffic","The RADIUS shared secret","The SSID","The client IP address"],a:[0],e:"The handshake proves both sides have the PMK and derives the PTK plus delivers the GTK for broadcast/multicast."},
{id:"e75",d:5,q:"Which command blocks all traffic to the router's vty lines except from 10.10.10.0/24?",o:["access-list 10 permit 10.10.10.0 0.0.0.255 and 'access-class 10 in' on line vty 0 15","ip access-group 10 out on all interfaces","transport input none","no ip http server"],a:[0],e:"The implicit deny blocks everyone else. Apply to all vty lines, including 5-15 or 0-15."},
{id:"e76",d:5,q:"Which two practices harden device management access? (Choose two.)",o:["Disable unused services like HTTP server and CDP on untrusted edges","Use SSHv2 and SNMPv3 instead of Telnet and SNMPv2c","Use the same password on every device","Allow management from any source","Keep default credentials"],a:[0,1],e:"Turn off what you don't need, use encrypted protocols, restrict sources with ACLs, and use AAA with unique accounts."},
{id:"e77",d:5,q:"What does uRPF (unicast Reverse Path Forwarding) in strict mode do?",o:["Drops packets whose source address isn't reachable via the interface they arrived on","Drops multicast packets","Checks the destination address","Encrypts packets"],a:[0],e:"uRPF stops spoofed source addresses. Loose mode only checks that a route to the source exists anywhere, which suits asymmetric routing."},
{id:"e78",d:5,q:"What is the purpose of an infrastructure ACL (iACL) at the network edge?",o:["Block outside traffic destined to the network devices' own addresses while permitting transit traffic","Permit all traffic to routers","Filter only user web browsing","Shape traffic"],a:[0],e:"iACLs protect the infrastructure address space from direct attack, allowing only needed protocols like BGP from known peers."},
{id:"e79",d:5,q:"What does the 'login block-for 120 attempts 5 within 60' command do?",o:["Blocks logins for 120 seconds if 5 failed attempts happen within 60 seconds","Allows 5 sessions for 120 seconds","Locks the console for 60 minutes","Sets the SSH timeout"],a:[0],e:"It slows brute-force attacks. login quiet-mode access-class can exempt trusted management hosts."},
{id:"e80",d:5,q:"Which statement about IPsec site-to-site VPN in a security design is correct?",o:["It provides confidentiality, integrity, and authentication for traffic between sites over an untrusted network","It only provides compression","It replaces the need for routing","It only works on Layer 2"],a:[0],e:"IPsec protects data in transit over the internet. Combined with GRE, VTI, DMVPN, or FlexVPN it scales to many sites with dynamic routing."},
{id:"e81",d:5,q:"Which Cisco technology lets remote users connect securely using a client like Cisco Secure Client (AnyConnect)?",o:["Remote access VPN using SSL/TLS or IKEv2","Site-to-site GRE","DMVPN Phase 1","VRF-Lite"],a:[0],e:"Remote access VPN terminates on an ASA, FTD, or router and can use ISE/RADIUS for authentication and posture."},
{id:"e82",d:5,q:"What does the ISE 'dACL' (downloadable ACL) do?",o:["Pushes a per-session ACL from ISE to the switch after authentication","Downloads the ISE software","Filters RADIUS packets","Creates VLANs"],a:[0],e:"A dACL is applied to the authenticated session on the port, restricting what that user or device can reach."},
{id:"e83",d:5,q:"What is a typical result of a successful 802.1X authorization from ISE on a switch port?",o:["Dynamic VLAN assignment, a dACL, and/or an SGT for the session","The port becomes a trunk","The switch reloads","The user's IP becomes static"],a:[0],e:"The authorization profile can include VLAN, dACL, SGT, and other attributes in the RADIUS Access-Accept."},
{id:"e84",d:5,q:"Which 802.1X host mode allows one data device and one voice device on a port, each authenticated separately?",o:["multi-domain","single-host","multi-auth","multi-host"],a:[0],e:"Multi-domain authenticates one voice (in the voice VLAN) and one data client. Multi-auth allows many clients each authenticated. Multi-host authenticates the first and lets the rest through."},
{id:"e85",d:5,q:"What is 802.1X 'monitor mode' (open mode) used for in a deployment?",o:["Letting traffic flow regardless of authentication result while logging, so you can see what would fail before enforcing","Blocking all traffic until authentication","Encrypting traffic","Turning off RADIUS"],a:[0],e:"authentication open lets you deploy 802.1X in phases: monitor, low impact (with a pre-auth ACL), then closed mode."},
{id:"e86",d:5,q:"What is the purpose of a pre-authentication ACL in low-impact mode?",o:["Allow limited traffic like DHCP, DNS, and PXE before a device authenticates","Block all traffic","Permit everything","Encrypt traffic"],a:[0],e:"Low-impact mode applies a restrictive port ACL until authentication succeeds, then ISE pushes a dACL or other authorization."},
{id:"e87",d:5,q:"Which security design element segments traffic by user and device role across the campus without redesigning IP subnets?",o:["Group-based policy using SGTs","Adding more VLANs","Static routes","Larger subnets"],a:[0],e:"SGTs decouple policy from IP addressing, so you write policy in terms of groups like Employees, Contractors, and IoT."},
{id:"e88",d:5,q:"Which TLS-based technology is used by Cisco Secure Network Analytics to find malware in encrypted traffic without decrypting it?",o:["Encrypted Traffic Analytics (ETA)","SSL decryption on the firewall","IPsec","MACsec"],a:[0],e:"ETA uses telemetry such as packet length/timing and the TLS handshake to spot malicious patterns in encrypted flows."},
{id:"e89",d:5,q:"Which IPS deployment mode can block traffic, as opposed to only alerting?",o:["Inline mode","Promiscuous mode with a SPAN port","Passive tap","NetFlow analysis"],a:[0],e:"Inline IPS sits in the traffic path and drops malicious packets. Promiscuous (IDS) gets a copy and can only alert."},
{id:"e90",d:5,q:"What is the main purpose of an SSL/TLS certificate on a network device's HTTPS management or API?",o:["Prove the device's identity and enable an encrypted session","Assign the device an IP","Speed up the connection","Replace AAA"],a:[0],e:"Use certificates from a trusted CA so clients can validate the device and avoid man-in-the-middle attacks."},
{id:"e91",d:5,q:"Which IPv6 first hop security feature blocks rogue router advertisements on access ports?",o:["RA Guard","DHCP snooping for IPv4","IP Source Guard for IPv4","BPDU guard"],a:[0],e:"RA Guard drops RAs from host-facing ports. Other IPv6 FHS features include DHCPv6 Guard, ND inspection, and source guard."},
{id:"e92",d:5,q:"Which wireless authentication option lets users register their own personal devices with corporate credentials and get a certificate?",o:["BYOD onboarding through ISE","WEP","Open SSID","MAB only"],a:[0],e:"ISE BYOD flows provision certificates and supplicant profiles so personal devices can then use EAP-TLS."},
{id:"e93",d:5,q:"What is the difference between authentication and accounting in AAA?",o:["Authentication verifies identity; accounting records what the user did and for how long","They are the same","Accounting verifies identity; authentication records sessions","Accounting decides which commands are allowed"],a:[0],e:"Accounting gives an audit trail for compliance and billing. Authorization is what decides permissions."},
{id:"e94",d:5,q:"Which command defines a TACACS+ server on IOS XE using the newer syntax?",o:["tacacs server ISE1 / address ipv4 10.1.1.5 / key MyKey","tacacs-server host 10.1.1.5 key MyKey only","radius server ISE1","aaa server tacacs 10.1.1.5"],a:[0],e:"The 'tacacs server NAME' block replaces the legacy tacacs-server host form. Then group it under aaa group server tacacs+ for method lists."},
{id:"e95",d:5,q:"Which IOS feature lets an admin role see only specific commands, such as 'show' commands, without full privilege?",o:["Role-based CLI views (parser view)","enable password","line con 0","service password-encryption"],a:[0],e:"Parser views define command sets per role. TACACS+ command authorization is a more scalable way to do the same."},
{id:"e96",d:5,q:"What does a 'deny ip any any log' line at the end of an ACL add?",o:["Logs packets that would be dropped by the implicit deny, which helps troubleshooting","Permits all traffic","Disables the ACL","Encrypts logged traffic"],a:[0],e:"The implicit deny doesn't log. An explicit deny with log shows what's being blocked, though logging uses CPU so rate-limit it."},
{id:"e97",d:5,q:"Which security approach places multiple layers like firewalls, IPS, endpoint protection, and AAA so one failure doesn't expose everything?",o:["Defense in depth","Security by obscurity","Single perimeter","Implicit trust"],a:[0],e:"Layered controls mean an attacker must defeat several protections, and each layer gives a chance to detect them."},
{id:"e98",d:5,q:"Which Cisco product manages Firepower Threat Defense (FTD) firewalls centrally?",o:["Firepower Management Center (Secure Firewall Management Center)","Catalyst Center","ISE","vManage"],a:[0],e:"FMC (now Secure Firewall Management Center) centrally configures policies and collects events. FDM is the on-box manager for single devices."},
{id:"e99",d:5,q:"Which statement about Wi-Fi Enhanced Open (OWE) is correct?",o:["It encrypts traffic on open networks without a password","It requires a pre-shared key","It requires 802.1X","It's the same as WEP"],a:[0],e:"OWE does an unauthenticated Diffie-Hellman exchange so each client gets unique encryption on an open SSID, like a coffee shop."},
{id:"e100",d:5,q:"An ACL is applied outbound on an interface. Which traffic does it filter?",o:["Traffic leaving that interface, but not traffic generated by the router itself","Traffic entering the interface","All traffic including router-generated packets","Only management traffic"],a:[0],e:"Outbound ACLs check transit packets after routing. Locally originated traffic (like routing updates from the router) isn't filtered by outbound ACLs on IOS."},
// ---------- Domain 6: Automation ----------
{id:"f1",d:6,q:"What does this Python code print?\n\nvlans = [10, 20, 30]\nvlans.append(40)\nprint(len(vlans))",o:["4","3","40","[10, 20, 30, 40]"],a:[0],e:"append adds one item to the end of the list, so it now has four elements. len returns 4."},
{id:"f2",d:6,q:"What does this Python code print?\n\ndevice = {\"hostname\": \"R1\", \"ip\": \"10.1.1.1\"}\nprint(device[\"ip\"])",o:["10.1.1.1","ip","R1","{'ip': '10.1.1.1'}"],a:[0],e:"A dictionary maps keys to values. device['ip'] returns the value for the key 'ip'."},
{id:"f3",d:6,q:"What does this Python code print?\n\nfor i in range(3):\n    print(i, end=\" \")",o:["0 1 2","1 2 3","0 1 2 3","3"],a:[0],e:"range(3) yields 0, 1, 2. The stop value isn't included."},
{id:"f4",d:6,q:"What is the output?\n\nintfs = [\"Gi1\", \"Gi2\", \"Gi3\"]\nprint(intfs[-1])",o:["Gi3","Gi1","Gi2","An IndexError"],a:[0],e:"Negative indexes count from the end. -1 is the last item."},
{id:"f5",d:6,q:"What is the output?\n\ncpu = 85\nif cpu > 90:\n    print(\"critical\")\nelif cpu > 80:\n    print(\"warning\")\nelse:\n    print(\"ok\")",o:["warning","critical","ok","warning and ok"],a:[0],e:"85 isn't > 90, but it is > 80, so the elif branch runs. Only one branch of if/elif/else runs."},
{id:"f6",d:6,q:"Which Python module converts a JSON string into a Python dictionary?",o:["json, using json.loads()","yaml, using yaml.dump()","os, using os.read()","re, using re.match()"],a:[0],e:"json.loads(string) parses JSON to Python objects. json.dumps(obj) does the reverse. json.load/dump work with files."},
{id:"f7",d:6,q:"What does json.dumps(data, indent=2) return?",o:["A formatted JSON string","A Python dictionary","A file object","A list of keys"],a:[0],e:"dumps = dump to string. indent makes it human-readable."},
{id:"f8",d:6,q:"Which Python library is most commonly used to send HTTP requests to REST APIs?",o:["requests","ncclient","netmiko","paramiko"],a:[0],e:"requests.get/post/put/delete send HTTP calls. ncclient is NETCONF, Netmiko and Paramiko are SSH."},
{id:"f9",d:6,q:"What is the output?\n\nr = {\"response\": [{\"hostname\": \"SW1\"}, {\"hostname\": \"SW2\"}]}\nprint(r[\"response\"][1][\"hostname\"])",o:["SW2","SW1","response","KeyError"],a:[0],e:"r['response'] is a list. Index 1 is the second dict, and its 'hostname' is SW2."},
{id:"f10",d:6,q:"Which JSON data types are valid?",o:["string, number, boolean, null, object, array","string, integer, tuple, set","string, char, float, date","list, dict, tuple, None"],a:[0],e:"JSON has six types. Objects are { } with key/value pairs; arrays are [ ]. Python maps them to dict and list, and null to None."},
{id:"f11",d:6,q:"Which is valid JSON?",o:["{\"vlan\": 10, \"name\": \"USERS\", \"active\": true}","{'vlan': 10, 'name': 'USERS'}","{vlan: 10, name: USERS}","{\"vlan\": 10, \"name\": \"USERS\",}"],a:[0],e:"JSON needs double-quoted keys and strings, lowercase true/false/null, and no trailing commas."},
{id:"f12",d:6,q:"In JSON, what does [ ] represent?",o:["An array (ordered list)","An object","A string","A comment"],a:[0],e:"Square brackets hold an ordered list of values. Curly braces hold an object of key/value pairs. JSON doesn't support comments."},
{id:"f13",d:6,q:"What is YANG?",o:["A data modeling language that defines the structure of configuration and state data","A transport protocol","An encoding format like JSON","A Python library"],a:[0],e:"YANG models describe data. NETCONF/RESTCONF/gNMI transport it, encoded as XML or JSON."},
{id:"f14",d:6,q:"Which YANG statement groups related nodes, like all interface settings, without being a list?",o:["container","leaf","leaf-list","list"],a:[0],e:"A container holds child nodes and appears once. A list holds multiple entries identified by keys."},
{id:"f15",d:6,q:"Which type of YANG model is written by standards bodies and works across vendors?",o:["IETF or OpenConfig models","Cisco native models","Proprietary CLI models","SNMP MIBs"],a:[0],e:"IETF and OpenConfig models are vendor-neutral. Cisco native (Cisco-IOS-XE-native) models cover full platform features."},
{id:"f16",d:6,q:"Which NETCONF operation changes the configuration?",o:["<edit-config>","<get-config>","<get>","<close-session>"],a:[0],e:"<edit-config> applies config to a target datastore. <get-config> reads config, <get> reads config and state."},
{id:"f17",d:6,q:"What is exchanged first when a NETCONF session starts?",o:["<hello> messages advertising capabilities","<get-config>","<lock>","An HTTP GET"],a:[0],e:"Both sides send hello with their supported capabilities (YANG modules and features) before RPCs."},
{id:"f18",d:6,q:"Which HTTP method in RESTCONF replaces a resource entirely?",o:["PUT","PATCH","GET","POST"],a:[0],e:"PUT creates or replaces. PATCH merges changes. POST creates a new child resource. DELETE removes. GET reads."},
{id:"f19",d:6,q:"Which HTTP method should you use to update only one field of an existing resource without replacing the rest?",o:["PATCH","PUT","DELETE","HEAD"],a:[0],e:"PATCH merges the supplied data into the existing resource. PUT replaces the whole resource, which could delete fields you didn't send."},
{id:"f20",d:6,q:"Which HTTP methods map to CRUD Create, Read, Update, Delete?",o:["POST, GET, PUT/PATCH, DELETE","GET, POST, DELETE, PUT","PUT, GET, POST, REMOVE","CREATE, READ, UPDATE, DELETE"],a:[0],e:"POST creates, GET reads, PUT/PATCH update, DELETE deletes."},
